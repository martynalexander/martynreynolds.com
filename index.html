<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Martyn Reynolds' Images</title>
   <style>
          body {
            margin: 0;
            padding: 0;
            background-color: #fff;
            overflow-x: hidden;
        }

        /* Container managing the structural swap between views */
        #archive-view {
            display: block;
            background-color: #fff;
        }

        .collage-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            grid-auto-rows: 150px;
            grid-auto-flow: dense;
            gap: 0; 
            background-color: #fff;
        }
        .collage-grid a,
        .collage-grid video {
            width: 100%;
            height: 100%;
            display: block;
            cursor: pointer;
            text-decoration: none;
        }
        .collage-grid img,
        .collage-grid video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .wide { grid-column: span 2; }
        .tall { grid-row: span 2; }
        .big  { grid-column: span 2; grid-row: span 2; }

        /* PRESENTATION MAIN PORTFOLIO LAYOUT WINDOW */
        #detail-view {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #fff;
            z-index: 100000;
            box-sizing: border-box;
            font-family: sans-serif;
            opacity: 0;
            transition: opacity 0.3s ease;
            overflow-y: scroll;
            -webkit-overflow-scrolling: touch;
            pointer-events: none;
        }

        #detail-view.active-stage {
            pointer-events: auto;
        }

        .gallery-split-wrapper {
            width: 100vw;
            min-height: 100vh;
            position: relative;
            display: block;
        }

        .artwork-container {
            width: 100vw;
            max-width: 100vw;
            position: relative;
            display: flex;
            justify-content: center;
        }

        .artwork-container img, 
        .artwork-container video {
            width: 100vw;
            height: auto;
            object-fit: contain;
            display: block;
        }

        /* FLOATS TEXT CONVENIENTLY IN THE CORNER MINIMALIST STYLE */
        .artwork-details {
            text-align: right;
            box-sizing: border-box;
            padding: 0;
            margin-top: 0;
            position: fixed; 
            bottom: 18px;
            right: 18px;
            width: calc(100vw - 36px);
            z-index: 200000 !important;
            pointer-events: none;
            transition: color 0.2s ease;
        }

        .artwork-details.light-text h1,
        .artwork-details.light-text p,
        .artwork-details.light-text .back-link {
            color: #fff !important;
        }

        .artwork-details h1 {
            font-weight: 300; 
            font-size: 11px;
            font-style: italic;
            letter-spacing: 1px;
            color: #000;
            margin: 0; 
            line-height: 1.38; 
        }

        .artwork-details p {
            color: #000;
            font-weight: 300; 
            font-size: 11px;
            letter-spacing: 1px; 
            margin: 0;
            line-height: 1.38; 
        }

        .back-link {
            color: #000;
            text-decoration: none;
            font-size: 11px;
            font-weight: 300; 
            letter-spacing: 1px;
            text-transform: lowercase;
            cursor: pointer !important;
            display: inline-block;
            margin-top: 25px; 
            line-height: 1.38;
            pointer-events: auto;
        }

        .back-link:hover { 
            color: #666; 
        }

        .artwork-details.light-text .back-link:hover { 
            color: rgba(255, 255, 255, 0.5) !important; 
        }

        /* INVISIBLE CLICK RE-ROUTING TOUCH CHANNELS LOCKING SENSORS */
        .nav-zone {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 50%;
            height: 100%;
            z-index: 150000 !important;
        }
        
        .nav-zone-left { 
            left: 0; 
            cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://w3.org" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="black" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>') 16 16, auto !important;
        }
        
        .nav-zone-right { 
            right: 0; 
            cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://w3.org" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="black" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>') 16 16, auto !important;
        }
    </style>
</head>

            </div>
            
            <div class="artwork-details" onclick="event.stopPropagation()">
                <h1 id="title-target">Artwork Title</h1>
                <p id="info-target">Metadata text column entries apply cleanly here.</p>
                <a onclick="hideArtworkPage(event)" class="back-link">back to images</a>

    <script>
        const archiveView = document.getElementById('archive-view');
        const detailView = document.getElementById('detail-view');
        const mediaTarget = document.getElementById('media-target');
        const titleTarget = document.getElementById('title-target');
        const infoTarget = document.getElementById('info-target');

        let currentArtworkIndex = 0;
        let allArtworkElements = [];

        function refreshArtworkList() {
            allArtworkElements = Array.from(document.querySelectorAll('.collage-grid > a, .collage-grid > video'));
        }

        // ---------------------------------------------------------------
        // AUTO BRIGHTNESS DETECTION
        // Samples the bottom-right corner of the displayed image (the area
        // behind the floating text) and switches to light or dark text.
        //
        // ORIENTATION RULE:
        // Portrait mode → text sits below the image in white space, so
        // always use black text and skip canvas sampling entirely.
        // Landscape mode (or desktop) → text overlaps the image, so run
        // the full brightness detection as normal.
        // ---------------------------------------------------------------

        function isPortraitMode() {
            return window.innerHeight > window.innerWidth;
        }

        function detectBrightnessAndSetText(imgElement) {
            const detailsContainer = document.querySelector('.artwork-details');

            // Portrait: text is below the image — always black, no sampling needed
            if (isPortraitMode()) {
                detailsContainer.classList.remove('light-text');
                return;
            }

            // Fallback: default to dark text if canvas sampling fails
            detailsContainer.classList.remove('light-text');

            try {
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');

                // We only need to sample a small patch — bottom-right corner
                const sampleW = 220;
                const sampleH = 120;
                canvas.width = sampleW;
                canvas.height = sampleH;

                // Work out where the image is actually rendered on screen
                const rect = imgElement.getBoundingClientRect();
                const scaleX = imgElement.naturalWidth / rect.width;
                const scaleY = imgElement.naturalHeight / rect.height;

                // Map the on-screen bottom-right patch to source image coords
                const srcX = Math.max(0, imgElement.naturalWidth - sampleW * scaleX);
                const srcY = Math.max(0, imgElement.naturalHeight - sampleH * scaleY);
                const srcW = imgElement.naturalWidth - srcX;
                const srcH = imgElement.naturalHeight - srcY;

                ctx.drawImage(imgElement, srcX, srcY, srcW, srcH, 0, 0, sampleW, sampleH);

                const data = ctx.getImageData(0, 0, sampleW, sampleH).data;

                // Calculate average perceptual luminance across sampled pixels
                let totalLuminance = 0;
                const pixelCount = sampleW * sampleH;
                for (let i = 0; i < data.length; i += 4) {
                    const r = data[i], g = data[i + 1], b = data[i + 2];
                    // Standard luminance weights (ITU-R BT.709)
                    totalLuminance += 0.2126 * r + 0.7152 * g + 0.0722 * b;
                }
                const avgLuminance = totalLuminance / pixelCount;

                // Threshold: below 140 out of 255 = dark region → use white text
                if (avgLuminance < 140) {
                    detailsContainer.classList.add('light-text');
                } else {
                    detailsContainer.classList.remove('light-text');
                }
            } catch (e) {
                // CORS or other error — silently fall back to dark text
                detailsContainer.classList.remove('light-text');
            }
        }

        // For videos: sample a frame once the video has loaded enough data
        function detectVideoBrightnessAndSetText(videoElement) {
            const detailsContainer = document.querySelector('.artwork-details');

            // Portrait: text is below the image — always black, no sampling needed
            if (isPortraitMode()) {
                detailsContainer.classList.remove('light-text');
                return;
            }

            // Landscape/desktop: default to white while frame loads (most videos are dark)
            detailsContainer.classList.add('light-text');

            const doSample = () => {
                try {
                    const sampleW = 220;
                    const sampleH = 120;
                    const canvas = document.createElement('canvas');
                    canvas.width = sampleW;
                    canvas.height = sampleH;
                    const ctx = canvas.getContext('2d');

                    const vw = videoElement.videoWidth;
                    const vh = videoElement.videoHeight;
                    if (!vw || !vh) return; // not ready yet

                    const rect = videoElement.getBoundingClientRect();
                    const scaleX = vw / rect.width;
                    const scaleY = vh / rect.height;

                    const srcX = Math.max(0, vw - sampleW * scaleX);
                    const srcY = Math.max(0, vh - sampleH * scaleY);
                    const srcW = vw - srcX;
                    const srcH = vh - srcY;

                    ctx.drawImage(videoElement, srcX, srcY, srcW, srcH, 0, 0, sampleW, sampleH);
                    const data = ctx.getImageData(0, 0, sampleW, sampleH).data;

                    let totalLuminance = 0;
                    const pixelCount = sampleW * sampleH;
                    for (let i = 0; i < data.length; i += 4) {
                        const r = data[i], g = data[i + 1], b = data[i + 2];
                        totalLuminance += 0.2126 * r + 0.7152 * g + 0.0722 * b;
                    }
                    const avgLuminance = totalLuminance / pixelCount;

                    if (avgLuminance < 140) {
                        detailsContainer.classList.add('light-text');
                    } else {
                        detailsContainer.classList.remove('light-text');
                    }
                } catch (e) {
                    detailsContainer.classList.add('light-text'); // safe fallback for video
                }
            };

            if (videoElement.readyState >= 2) {
                doSample();
            } else {
                videoElement.addEventListener('loadeddata', doSample, { once: true });
            }
        }

        function showArtworkPage(element, mediaType) {
            refreshArtworkList();
            currentArtworkIndex = allArtworkElements.indexOf(element);
            if (currentArtworkIndex === -1) currentArtworkIndex = 0;

            const detectedType = mediaType || (element.tagName.toLowerCase() === 'video' ? 'video' : 'image');
            loadArtworkData(element, detectedType);

            archiveView.style.display = 'none';
            window.scrollTo(0, 0);
            
            detailView.style.display = 'block'; 
            detailView.classList.add('active-stage'); 
            
            setTimeout(() => {
                detailView.style.opacity = '1';
            }, 50);
        }

        function loadArtworkData(element, mediaType) {
            let rawText = "";
            const typeToCheck = mediaType || (element.tagName.toLowerCase() === 'video' ? 'video' : 'image');
            
            const leftZone = document.querySelector('.nav-zone-left');
            const rightZone = document.querySelector('.nav-zone-right');
            const detailsContainer = document.querySelector('.artwork-details');

            // Reset text colour while new media loads
            detailsContainer.classList.remove('light-text');
            
            if (typeToCheck === 'video') {
                const source = element.querySelector('source');
                const newVideo = document.createElement('video');
                newVideo.setAttribute('autoplay', '');
                newVideo.setAttribute('loop', '');
                newVideo.setAttribute('muted', '');
                newVideo.setAttribute('playsinline', '');
                newVideo.setAttribute('onclick', 'event.stopPropagation()');
                const newSource = document.createElement('source');
                newSource.src = source.src;
                newSource.type = 'video/mp4';
                newVideo.appendChild(newSource);
                mediaTarget.innerHTML = '';
                mediaTarget.appendChild(newVideo);

                rawText = element.getAttribute('data-title') || "Video Documentation Loop";

                // Run brightness detection on the video element
                detectVideoBrightnessAndSetText(newVideo);

            } else {
                const img = element.querySelector('img');
                if (img) {
                    const newImg = new Image();
                    newImg.setAttribute('onclick', 'event.stopPropagation()');
                    newImg.alt = 'Focus view';

                    newImg.onload = function() {
                        // Image is fully decoded — safe to sample pixels now
                        detectBrightnessAndSetText(newImg);
                    };

                    newImg.src = img.src;
                    mediaTarget.innerHTML = '';
                    mediaTarget.appendChild(newImg);

                    rawText = img.alt || "Untitled";
                }
            }

            if (leftZone) mediaTarget.appendChild(leftZone);
            if (rightZone) mediaTarget.appendChild(rightZone);

            const textSegments = rawText.split('|');
            titleTarget.textContent = textSegments[0] ? textSegments[0].trim() : "Untitled";
            
            if (textSegments.length > 1) {
                const descriptions = textSegments.slice(1).map(item => item.trim());
                infoTarget.innerHTML = descriptions.join('<br>');
            } else {
                infoTarget.textContent = "";
            }
        }

        function navigateToAdjacentArtwork(event, direction) {
            if (event) event.stopPropagation(); 
            refreshArtworkList();

            currentArtworkIndex = (currentArtworkIndex + direction + allArtworkElements.length) % allArtworkElements.length;
            const targetElement = allArtworkElements[currentArtworkIndex];

            const detectedType = targetElement.tagName.toLowerCase() === 'video' ? 'video' : 'image';
            loadArtworkData(targetElement, detectedType);
            
            window.scrollTo(0, 0);
        }

        function hideArtworkPage(event) {
            if (event) event.preventDefault();
            detailView.style.opacity = '0';
            detailView.classList.remove('active-stage'); 
            
            setTimeout(() => {
                detailView.style.display = 'none';
                
                const leftZone = document.querySelector('.nav-zone-left');
                const rightZone = document.querySelector('.nav-zone-right');
                mediaTarget.innerHTML = '';
                if (leftZone) mediaTarget.appendChild(leftZone);
                if (rightZone) mediaTarget.appendChild(rightZone);
                
                archiveView.style.display = 'block';

                if (allArtworkElements[currentArtworkIndex]) {
                    allArtworkElements[currentArtworkIndex].scrollIntoView({ block: 'center', behavior: 'auto' });
                }
            }, 300);
        }

        // GLOBAL KEYBOARD SENSORS
        window.addEventListener('keydown', function(event) {
            if (detailView.style.display === 'block') {
                if (event.key === 'ArrowRight') {
                    navigateToAdjacentArtwork(event, 1);
                } else if (event.key === 'ArrowLeft') {
                    navigateToAdjacentArtwork(event, -1);
                } else if (event.key === 'Escape') {
                    hideArtworkPage(event);
                }
            }
        });

        // SANDBOXED TOUCH ENGINE
        let touchStartX = 0;
        let touchEndX = 0;

        detailView.addEventListener('touchstart', function(event) {
            touchStartX = event.changedTouches[0].screenX;
        }, { passive: true });

        detailView.addEventListener('touchend', function(event) {
            touchEndX = event.changedTouches[0].screenX;
            handleSwipeGesture(event);
        }, { passive: true });

        // RE-EVALUATE TEXT COLOUR ON SCREEN ROTATION
        // When the device rotates, re-run detection on whatever is currently showing
        window.addEventListener('resize', function() {
            if (detailView.style.display !== 'block') return;
            const currentMedia = mediaTarget.querySelector('img, video');
            if (!currentMedia) return;
            if (currentMedia.tagName.toLowerCase() === 'video') {
                detectVideoBrightnessAndSetText(currentMedia);
            } else {
                detectBrightnessAndSetText(currentMedia);
            }
        });

        function handleSwipeGesture(event) {
            const swipeDistance = touchEndX - touchStartX;
            const thresholdPixelGap = 50; 

            if (Math.abs(swipeDistance) > thresholdPixelGap) {
                if (swipeDistance < 0) {
                    navigateToAdjacentArtwork(event, 1);  
                } else {
                    navigateToAdjacentArtwork(event, -1); 
                }
            }
            touchStartX = 0;
            touchEndX = 0;
        }
    </script>
</body>
</html>
