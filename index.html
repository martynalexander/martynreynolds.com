<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Martyn Reynolds' Images</title>
   <style>
          body {
            margin: 0;
            padding: 0;
            background-color: #fff;
            overflow-x: hidden;
        }

        /* Container managing the structural swap between views */
        #archive-view {
            display: block;
            background-color: #fff;
        }

        .collage-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            grid-auto-rows: 150px;
            grid-auto-flow: dense;
            gap: 0; 
            background-color: #fff;
        }
        .collage-grid a,
        .collage-grid video {
            width: 100%;
            height: 100%;
            display: block;
            cursor: pointer;
            text-decoration: none;
        }
        .collage-grid img,
        .collage-grid video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .wide { grid-column: span 2; }
        .tall { grid-row: span 2; }
        .big  { grid-column: span 2; grid-row: span 2; }

        /* PRESENTATION MAIN PORTFOLIO LAYOUT WINDOW */
        #detail-view {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #fff;
            z-index: 100000;
            box-sizing: border-box;
            font-family: sans-serif;
            opacity: 0;
            transition: opacity 0.3s ease;
            overflow-y: scroll;
            -webkit-overflow-scrolling: touch;
            pointer-events: none;
        }

        #detail-view.active-stage {
            pointer-events: auto;
        }

        .gallery-split-wrapper {
            width: 100vw;
            min-height: 100vh;
            position: relative;
            display: block;
        }

        .artwork-container {
            width: 100vw;
            max-width: 100vw;
            min-height: 100vh;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: flex-start; /* mobile: image anchored to top */
        }

        /* Desktop: vertically centre the image within the viewport */
        @media (hover: hover) and (pointer: fine) {
            .artwork-container {
                align-items: center;
            }
        }

        .artwork-container img, 
        .artwork-container video {
            width: 100vw;
            height: auto;
            object-fit: contain;
            display: block;
            position: relative;
            z-index: 1; /* sits above the wrapper click zone */
        }

        /* FLOATS TEXT CONVENIENTLY IN THE CORNER MINIMALIST STYLE */
        .artwork-details {
            text-align: right;
            box-sizing: border-box;
            padding: 0;
            margin-top: 0;
            position: fixed; 
            bottom: 18px;
            right: 18px;
            width: calc(100vw - 36px);
            z-index: 200000 !important;
            pointer-events: none;
            transition: color 0.2s ease;
        }

        .artwork-details.light-text h1,
        .artwork-details.light-text p,
        .artwork-details.light-text .back-link {
            color: #fff !important;
        }

        .artwork-details h1 {
            font-weight: 300; 
            font-size: 11px;
            font-style: italic;
            letter-spacing: 1px;
            color: #000;
            margin: 0; 
            line-height: 1.38; 
        }

        .artwork-details p {
            color: #000;
            font-weight: 300; 
            font-size: 11px;
            letter-spacing: 1px; 
            margin: 0;
            line-height: 1.38; 
        }

        .back-link {
            color: #000;
            text-decoration: none;
            font-size: 11px;
            font-weight: 300; 
            letter-spacing: 1px;
            text-transform: lowercase;
            cursor: pointer !important;
            display: inline-block;
            margin-top: 25px; 
            line-height: 1.38;
            pointer-events: auto;
        }

        .back-link:hover { 
            color: #666; 
        }

        .artwork-details.light-text .back-link:hover { 
            color: rgba(255, 255, 255, 0.5) !important; 
        }

        /* INVISIBLE CLICK RE-ROUTING TOUCH CHANNELS LOCKING SENSORS */
        .nav-zone {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 50%;
            height: 100%;
            z-index: 150000 !important;
            cursor: none; /* hide system cursor — we show our own arrow indicators */
        }

        .nav-zone-left  { left: 0; }
        .nav-zone-right { right: 0; }

        /* MINIMAL FLAT ARROW INDICATORS — desktop only */
        .nav-arrow {
            display: none; /* hidden on mobile */
            position: fixed;
            top: 50%;
            transform: translateY(-50%);
            z-index: 250000;
            pointer-events: none; /* clicks pass through to nav-zone beneath */
            opacity: 0;
            transition: opacity 0.2s ease, color 0.2s ease;
            line-height: 1;
            font-size: 11px;
            letter-spacing: 2px;
            font-weight: 300;
            font-family: sans-serif;
            color: #000;
            text-transform: lowercase;
        }

        .nav-arrow-left  { left: 18px; }
        .nav-arrow-right { right: 18px; }

        /* Arrows flip white with the text block */
        .artwork-details.light-text ~ * .nav-arrow,
        body.light-nav .nav-arrow {
            color: #fff;
        }

        @media (hover: hover) and (pointer: fine) {
            .nav-arrow { display: block; }
        }
    </style>
</head>

    <script>
        const archiveView = document.getElementById('archive-view');
        const detailView = document.getElementById('detail-view');
        const mediaTarget = document.getElementById('media-target');
        const titleTarget = document.getElementById('title-target');
        const infoTarget = document.getElementById('info-target');

        let currentArtworkIndex = 0;
        let allArtworkElements = [];

        function refreshArtworkList() {
            allArtworkElements = Array.from(document.querySelectorAll('.collage-grid > a, .collage-grid > video'));
        }

        // ─────────────────────────────────────────────────────────────────
        // ORIENTATION HELPER
        // Uses matchMedia — reliable on Safari iOS unlike innerWidth/innerHeight
        // ─────────────────────────────────────────────────────────────────
        function isPortraitMode() {
            return window.matchMedia('(orientation: portrait)').matches;
        }

        // ─────────────────────────────────────────────────────────────────
        // CANVAS BRIGHTNESS SAMPLING
        // Shared core — pass any HTMLImageElement or HTMLVideoElement.
        // Returns average luminance (0–255) of the bottom-right patch,
        // or null if sampling failed (CORS, not ready, etc.)
        // ─────────────────────────────────────────────────────────────────
        function sampleBottomRightLuminance(mediaEl, scrollTop) {
            try {
                const sampleW = 220;
                const sampleH = 120;
                const canvas = document.createElement('canvas');
                canvas.width = sampleW;
                canvas.height = sampleH;
                const ctx = canvas.getContext('2d');

                const rect = mediaEl.getBoundingClientRect();

                let naturalW, naturalH;
                if (mediaEl.tagName.toLowerCase() === 'video') {
                    naturalW = mediaEl.videoWidth;
                    naturalH = mediaEl.videoHeight;
                    if (!naturalW || !naturalH) return null;
                } else {
                    naturalW = mediaEl.naturalWidth;
                    naturalH = mediaEl.naturalHeight;
                }

                // Scale factor between rendered pixels and source pixels
                const scaleX = naturalW / rect.width;
                const scaleY = naturalH / rect.height;

                // On-screen position of the text block (bottom-right, fixed)
                // We need to find what part of the image sits behind the text.
                // The text bottom edge is ~18px from screen bottom.
                // The text block is ~120px tall, so its top is ~138px from screen bottom.
                const screenH = window.innerHeight;
                const textAreaTopOnScreen = screenH - 138;  // approx top of text zone
                const textAreaBottomOnScreen = screenH - 18; // bottom of text zone

                // Convert screen y positions to image y positions
                // rect.top is where the image top edge sits on screen (may be negative if scrolled)
                const imgTopOnScreen = rect.top;
                const srcYtop    = Math.max(0, (textAreaTopOnScreen - imgTopOnScreen) * scaleY);
                const srcYbottom = Math.min(naturalH, (textAreaBottomOnScreen - imgTopOnScreen) * scaleY);

                // X: rightmost sampleW pixels
                const srcX = Math.max(0, naturalW - sampleW * scaleX);
                const srcW = naturalW - srcX;
                const srcH = srcYbottom - srcYtop;

                if (srcH <= 0 || srcW <= 0) return null; // text is off the image

                ctx.drawImage(mediaEl, srcX, srcYtop, srcW, srcH, 0, 0, sampleW, sampleH);
                const data = ctx.getImageData(0, 0, sampleW, sampleH).data;

                let total = 0;
                const pixels = sampleW * sampleH;
                for (let i = 0; i < data.length; i += 4) {
                    total += 0.2126 * data[i] + 0.7152 * data[i+1] + 0.0722 * data[i+2];
                }
                return total / pixels;
            } catch(e) {
                return null;
            }
        }

        function applyTextColour(luminance) {
            const detailsContainer = document.querySelector('.artwork-details');
            if (luminance === null) {
                detailsContainer.classList.remove('light-text');
                return;
            }
            if (luminance < 168) {  // shifted 20% toward white sensitivity
                detailsContainer.classList.add('light-text');
            } else {
                detailsContainer.classList.remove('light-text');
            }
        }

        // ─────────────────────────────────────────────────────────────────
        // SCROLL-LINKED BRIGHTNESS LOOP
        // Runs on a throttled rAF loop while the detail view is open.
        // Samples on every animation frame but only recomputes every ~100ms.
        // ─────────────────────────────────────────────────────────────────
        let brightnessLoopActive = false;
        let lastBrightnessSample = 0;

        function startBrightnessLoop() {
            brightnessLoopActive = true;
            lastBrightnessSample = 0;

            function loop(timestamp) {
                if (!brightnessLoopActive) return;

                // Throttle: only sample every 100ms
                if (timestamp - lastBrightnessSample > 100) {
                    lastBrightnessSample = timestamp;

                    // In portrait mode text is below image — always black
                    if (isPortraitMode()) {
                        applyTextColour(255);
                    } else {
                        const mediaEl = mediaTarget.querySelector('img, video');
                        if (mediaEl) {
                            const lum = sampleBottomRightLuminance(mediaEl, detailView.scrollTop);
                            if (lum !== null) applyTextColour(lum);
                        }
                    }
                }
                requestAnimationFrame(loop);
            }
            requestAnimationFrame(loop);
        }

        function stopBrightnessLoop() {
            brightnessLoopActive = false;
        }

        // ─────────────────────────────────────────────────────────────────
        // PINCH-TO-ZOOM: mobile — suppress swipe/tap navigation during pinch
        // ─────────────────────────────────────────────────────────────────
        let activeTouches = 0;
        let isPinching = false;

        detailView.addEventListener('touchstart', function(e) {
            activeTouches = e.touches.length;
            if (activeTouches >= 2) {
                isPinching = true;
            }
        }, { passive: true });

        detailView.addEventListener('touchend', function(e) {
            activeTouches = e.touches.length;
            // Keep isPinching true until all fingers lift, then clear after short delay
            if (activeTouches === 0) {
                setTimeout(() => { isPinching = false; }, 300);
            }
        }, { passive: true });

        detailView.addEventListener('touchmove', function(e) {
            if (e.touches.length >= 2) {
                isPinching = true;
            }
        }, { passive: true });

        // ─────────────────────────────────────────────────────────────────
        // CORE NAVIGATION
        // ─────────────────────────────────────────────────────────────────
        function showArtworkPage(element, mediaType) {
            refreshArtworkList();
            currentArtworkIndex = allArtworkElements.indexOf(element);
            if (currentArtworkIndex === -1) currentArtworkIndex = 0;

            const detectedType = mediaType || (element.tagName.toLowerCase() === 'video' ? 'video' : 'image');
            loadArtworkData(element, detectedType);

            archiveView.style.display = 'none';
            detailView.scrollTop = 0;

            detailView.style.display = 'block';
            detailView.classList.add('active-stage');

            setTimeout(() => {
                detailView.style.opacity = '1';
                startBrightnessLoop();
            }, 50);
        }

        function loadArtworkData(element, mediaType) {
            let rawText = "";
            const typeToCheck = mediaType || (element.tagName.toLowerCase() === 'video' ? 'video' : 'image');

            const leftZone = document.querySelector('.nav-zone-left');
            const rightZone = document.querySelector('.nav-zone-right');
            const detailsContainer = document.querySelector('.artwork-details');

            detailsContainer.classList.remove('light-text');

            if (typeToCheck === 'video') {
                const source = element.querySelector('source');
                const newVideo = document.createElement('video');
                newVideo.setAttribute('autoplay', '');
                newVideo.setAttribute('loop', '');
                newVideo.setAttribute('muted', '');
                newVideo.setAttribute('playsinline', '');
                newVideo.setAttribute('onclick', 'event.stopPropagation()');
                const newSource = document.createElement('source');
                newSource.src = source.src;
                newSource.type = 'video/mp4';
                newVideo.appendChild(newSource);
                mediaTarget.innerHTML = '';
                mediaTarget.appendChild(newVideo);
                rawText = element.getAttribute('data-title') || "Video Documentation Loop";

            } else {
                const img = element.querySelector('img');
                if (img) {
                    const newImg = new Image();
                    newImg.setAttribute('onclick', 'event.stopPropagation()');
                    newImg.alt = 'Focus view';
                    newImg.src = img.src;
                    mediaTarget.innerHTML = '';
                    mediaTarget.appendChild(newImg);
                    rawText = img.alt || "Untitled";
                }
            }

            if (leftZone) mediaTarget.appendChild(leftZone);
            if (rightZone) mediaTarget.appendChild(rightZone);

            const textSegments = rawText.split('|');
            titleTarget.textContent = textSegments[0] ? textSegments[0].trim() : "Untitled";

            if (textSegments.length > 1) {
                const descriptions = textSegments.slice(1).map(item => item.trim());
                infoTarget.innerHTML = descriptions.join('<br>');
            } else {
                infoTarget.textContent = "";
            }
        }

        function navigateToAdjacentArtwork(event, direction) {
            if (event) event.stopPropagation();
            if (isPinching) return; // block navigation during pinch zoom
            refreshArtworkList();

            currentArtworkIndex = (currentArtworkIndex + direction + allArtworkElements.length) % allArtworkElements.length;
            const targetElement = allArtworkElements[currentArtworkIndex];

            const detectedType = targetElement.tagName.toLowerCase() === 'video' ? 'video' : 'image';
            loadArtworkData(targetElement, detectedType);
            detailView.scrollTop = 0;
        }

        function hideArtworkPage(event) {
            if (event) event.preventDefault();
            stopBrightnessLoop();
            detailView.style.opacity = '0';
            detailView.classList.remove('active-stage');

            setTimeout(() => {
                detailView.style.display = 'none';

                const leftZone = document.querySelector('.nav-zone-left');
                const rightZone = document.querySelector('.nav-zone-right');
                mediaTarget.innerHTML = '';
                if (leftZone) mediaTarget.appendChild(leftZone);
                if (rightZone) mediaTarget.appendChild(rightZone);

                archiveView.style.display = 'block';

                if (allArtworkElements[currentArtworkIndex]) {
                    allArtworkElements[currentArtworkIndex].scrollIntoView({ block: 'center', behavior: 'auto' });
                }
            }, 300);
        }

        // ─────────────────────────────────────────────────────────────────
        // KEYBOARD
        // ─────────────────────────────────────────────────────────────────
        window.addEventListener('keydown', function(event) {
            if (detailView.style.display === 'block') {
                if (event.key === 'ArrowRight') navigateToAdjacentArtwork(event, 1);
                else if (event.key === 'ArrowLeft') navigateToAdjacentArtwork(event, -1);
                else if (event.key === 'Escape') hideArtworkPage(event);
            }
        });

        // ─────────────────────────────────────────────────────────────────
        // TOUCH SWIPE — blocked when pinching
        // ─────────────────────────────────────────────────────────────────
        let touchStartX = 0;
        let touchEndX = 0;

        detailView.addEventListener('touchstart', function(event) {
            if (event.touches.length === 1) {
                touchStartX = event.changedTouches[0].screenX;
            }
        }, { passive: true });

        detailView.addEventListener('touchend', function(event) {
            if (isPinching) return;
            if (event.touches.length === 0 && !isPinching) {
                touchEndX = event.changedTouches[0].screenX;
                handleSwipeGesture(event);
            }
        }, { passive: true });

        function handleSwipeGesture(event) {
            if (isPinching) return;
            const swipeDistance = touchEndX - touchStartX;
            const thresholdPixelGap = 50;

            if (Math.abs(swipeDistance) > thresholdPixelGap) {
                if (swipeDistance < 0) navigateToAdjacentArtwork(event, 1);
                else navigateToAdjacentArtwork(event, -1);
            }
            touchStartX = 0;
            touchEndX = 0;
        }

        // ─────────────────────────────────────────────────────────────────
        // ORIENTATION CHANGE — brightness loop handles it automatically,
        // but we force an immediate re-check on rotation
        // ─────────────────────────────────────────────────────────────────
        window.matchMedia('(orientation: portrait)').addEventListener('change', function() {
            setTimeout(() => {
                if (brightnessLoopActive) lastBrightnessSample = 0; // force immediate resample
            }, 150);
        });

        // ─────────────────────────────────────────────────────────────────
        // MINIMAL ARROW INDICATORS — desktop only
        // Appear when mouse enters the nav zone, hide on exit.
        // Colour tracks the artwork-details light-text state.
        // ─────────────────────────────────────────────────────────────────
        const arrowLeft  = document.getElementById('arrow-left');
        const arrowRight = document.getElementById('arrow-right');

        function syncArrowColour() {
            const isLight = document.querySelector('.artwork-details').classList.contains('light-text');
            const col = isLight ? '#fff' : '#000';
            if (arrowLeft)  arrowLeft.style.color  = col;
            if (arrowRight) arrowRight.style.color = col;
        }

        // Patch applyTextColour to also sync arrow colour
        const _origApply = applyTextColour;
        applyTextColour = function(luminance) {
            _origApply(luminance);
            syncArrowColour();
        };

        // Show left arrow when hovering left nav zone
        const navZoneLeft  = document.querySelector('.nav-zone-left');
        const navZoneRight = document.querySelector('.nav-zone-right');

        if (navZoneLeft && arrowLeft) {
            navZoneLeft.addEventListener('mouseenter', () => { arrowLeft.style.opacity = '1'; });
            navZoneLeft.addEventListener('mouseleave', () => { arrowLeft.style.opacity = '0'; });
        }
        if (navZoneRight && arrowRight) {
            navZoneRight.addEventListener('mouseenter', () => { arrowRight.style.opacity = '1'; });
            navZoneRight.addEventListener('mouseleave', () => { arrowRight.style.opacity = '0'; });
        }

        // Hide arrows when detail view closes
        function hideArrows() {
            if (arrowLeft)  arrowLeft.style.opacity  = '0';
            if (arrowRight) arrowRight.style.opacity = '0';
        }
    </script>
</body>
</html>
