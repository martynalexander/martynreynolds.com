    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            overflow-x: hidden;
        }

        /* Container managing the structural swap between views */
        #archive-view {
            display: block;
        }

        .collage-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            grid-auto-rows: 150px;
            grid-auto-flow: dense;
            gap: 0; 
        }
        .collage-grid a,
        .collage-grid video {
            width: 100%;
            height: 100%;
            display: block;
            cursor: pointer;
            text-decoration: none;
        }
        /* Forces BOTH images and videos to scale and zoom identically */
        .collage-grid img,
        .collage-grid video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .wide { grid-column: span 2; }
        .tall { grid-row: span 2; }
        .big  { grid-column: span 2; grid-row: span 2; }

        /* Minimal Secondary Artwork Details Page Layout Style */
        #detail-view {
            display: none; /* Hidden until items are clicked */
            background-color: #fff;
            color: #000;
            font-family: sans-serif;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start; /* Forces content directly to the top edge */
            min-height: 100vh;
            box-sizing: border-box;
            padding: 0; /* Stripped container padding to remove top white space */
            opacity: 0;
            transition: opacity 0.3s ease;
            cursor: pointer; /* Pointer cue showing you can click anywhere to exit */
        }

        /* The structural wrapper containing the artwork frame and text column */
        .detail-wrapper {
            display: flex;
            flex-direction: column;
            align-items: flex-end; /* Snaps text box to the right hand side of the image */
            max-width: 100vw;
            margin-top: 0;
            cursor: default; /* Stops the grid click-back action inside the presentation zone */
        }

        .artwork-container {
            max-width: 100vw;
            max-height: 75vh;
            margin-bottom: 0;
            display: flex;
            justify-content: center;
        }

        .artwork-container img, 
        .artwork-container video {
            max-width: 100vw;
            max-height: 75vh;
            object-fit: contain;
            display: block;
        }

        /* Aligns metadata block lines precisely with the right border edge of the image */
        .artwork-details {
            text-align: right;
            box-sizing: border-box;
            padding: 15px 20px 40px 20px; /* Generates clean safe page edges */
            margin-top: 0;
        }

        /* Uniform sizing, light font styling, compressed spacing, Title Case formatting */
        .artwork-details h1 {
            font-weight: 300; 
            font-size: 13px;
            letter-spacing: 1px;
            text-transform: capitalize; 
            color: #000;
            margin: 0;
            line-height: 1.38; /* Increased by 10% for improved breathing room */
        }

        .artwork-details p {
            color: #000;
            font-weight: 300; 
            font-size: 13px;
            letter-spacing: 1px;
            text-transform: capitalize; 
            margin: 0;
            line-height: 1.38; /* Increased by 10% for improved breathing room */
        }

        /* Clean "Back to Images" navigation prompt sitting exactly two lines below */
        .back-link {
            color: #000;
            text-decoration: none;
            font-size: 13px;
            font-weight: 300; 
            letter-spacing: 1px;
            text-transform: capitalize; 
            cursor: pointer;
            display: inline-block;
            margin-top: 25px; 
            line-height: 1.38; /* Increased by 10% for improved breathing room */
        }

        .back-link:hover {
            color: #666;
        }
    </style>

    <!-- CLEAN SECONDARY METADATA PAGE CONTAINER -->
    <div id="detail-view" onclick="hideArtworkPage(event)">
        <div class="detail-wrapper" onclick="event.stopPropagation()">
            <div class="artwork-container" id="media-target">
                <!-- Selected Video / Image scales dynamically inside here -->
            </div>
            <div class="artwork-details">
                <h1 id="title-target">Artwork Title</h1>
                <p id="info-target">Metadata detail parameters apply here cleanly.</p>
                <a onclick="hideArtworkPage(event)" class="back-link">Back to Images</a>
            </div>
        </div>
    </div>

    <!-- Seamless Subpage Transition Script Logic -->
    <script>
        const archiveView = document.getElementById('archive-view');
        const detailView = document.getElementById('detail-view');
        const mediaTarget = document.getElementById('media-target');
        const titleTarget = document.getElementById('title-target');
        const infoTarget = document.getElementById('info-target');

        function showArtworkPage(element, mediaType) {
            let rawText = "";
            
            // 1. Capture content and metadata properties safely based on type
            if (mediaType === 'image') {
                const img = element.querySelector('img');
                mediaTarget.innerHTML = `<img src="${img.src}" alt="Focus view">`;
                rawText = img.alt || "Untitled";
            } else if (mediaType === 'video') {
                const source = element.querySelector('source');
                mediaTarget.innerHTML = `<video autoplay loop muted playsinline controls><source src="${source.src}" type="video/mp4"></video>`;
                rawText = element.getAttribute('data-title') || "Video Documentation Loop";
            }

            // 2. Parse structural layout split blocks using the vertical bar "|"
            const textSegments = rawText.split('|');
            titleTarget.textContent = textSegments[0] ? textSegments[0].trim() : "Untitled";
            
            if (textSegments.length > 1) {
                // Stack fields vertically into standard subtitle metadata text blocks
                const descriptions = textSegments.slice(1).map(item => item.trim());
                infoTarget.innerHTML = descriptions.join('<br>');
            } else {
                infoTarget.textContent = "";
            }

            // 3. Complete immediate structural transition view switch
            archiveView.style.display = 'none';
            window.scrollTo(0, 0); // Forces view top index normalization
            detailView.style.display = 'flex';
            setTimeout(() => {
                detailView.style.opacity = '1';
            }, 50);
        }

        function hideArtworkPage(event) {
            if (event) event.preventDefault();
            
            detailView.style.opacity = '0';
            setTimeout(() => {
                detailView.style.display = 'none';
                mediaTarget.innerHTML = ''; // Flushes source to freeze video loops instantly
                archiveView.style.display = 'block';
            }, 300);
        }
    </script>
