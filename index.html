    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #fff; /* Changed master fallback to white */
            overflow-x: hidden;
        }

        /* Container managing the structural swap between views */
        #archive-view {
            display: block;
            background-color: #fff; /* Ensures the background stays white during grid calculations */
        }

        .collage-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            grid-auto-rows: 150px;
            grid-auto-flow: dense;
            gap: 0; 
        }
        .collage-grid a,
        .collage-grid video {
            width: 100%;
            height: 100%;
            display: block;
            cursor: pointer;
            text-decoration: none;
        }
         /* Forces BOTH images and videos to scale and zoom identically */
        .collage-grid img,
        .collage-grid video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .wide { grid-column: span 2; }
        .tall { grid-row: span 2; }
        .big  { grid-column: span 2; grid-row: span 2; }

        /* Minimal Secondary Artwork Details Page Layout Style */
        #detail-view {
            display: none; /* Hidden until items are clicked */
            background-color: #fff;
            color: #000;
            font-family: sans-serif;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start; /* Forces content directly to the top edge */
            min-height: 100vh;
            box-sizing: border-box;
            padding: 0; /* Stripped container padding to remove top white space */
            opacity: 0;
            transition: opacity 0.3s ease;
            cursor: pointer; /* Pointer cue showing you can click anywhere to exit */
        }

        /* The structural wrapper containing the artwork frame and text column */
        .detail-wrapper {
            display: flex;
            flex-direction: column;
            align-items: flex-end; /* Snaps text box to the right hand side of the image */
            max-width: 100vw;
            margin-top: 0;
            cursor: default; /* Stops the grid click-back action inside the presentation zone */
        }

             .artwork-container {
            width: 100vw; 
            max-width: 100vw;
            margin-bottom: 0;
            display: flex;
            justify-content: center;
            position: relative; /* Context anchor for the invisible hit boxes */
        }

        .artwork-container img, 
        .artwork-container video {
            width: 100vw; 
            height: auto; 
            object-fit: contain;
            display: block;
        }

        /* Invisible Left/Right Split-Screen Touch Overlays */
        .nav-zone {
            position: absolute;
            top: 0;
            width: 50%; /* Divides the viewing window perfectly down the center */
            height: 100%;
            z-index: 10; /* Sits cleanly over the image layer */
        }
        .nav-zone-left {
            left: 0;
            /* Ultra-thin 1.25 width black left chevron (<) optimized for Safari's accessibility engine */
            cursor: url('data:image/svg+xml,%3Csvg xmlns="http://w3.org" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="black" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"%3E%3Cpath d="M15 18l-6-6 6-6"/%3E%3C/svg%3E') 16 16, auto;
        }

        .nav-zone-right {
            right: 0;
            /* Ultra-thin 1.25 width black right chevron (>) optimized for Safari's accessibility engine */
            cursor: url('data:image/svg+xml,%3Csvg xmlns="http://w3.org" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="black" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"%3E%3Cpath d="M9 18l6-6-6-6"/%3E%3C/svg%3E') 16 16, auto;
        }

        /* Aligns metadata block lines precisely with the right border edge of the image */
        .artwork-details {
            text-align: right;
            box-sizing: border-box;
            padding: 15px 5px 40px 20px; /* Generates clean safe page edges */
            margin-top: 0;
        }

        /* Uniform sizing, light font styling, compressed spacing, Title Case formatting */
        .artwork-details h1 {
            font-weight: 300; 
            font-size: 11px;
            letter-spacing: 1px;
            color: #000;
            margin: 0;
            line-height: 1.38; /* Increased by 10% for improved breathing room */
        }

        .artwork-details p {
            color: #000;
            font-weight: 300; 
            font-size: 11px;
            letter-spacing: 1px; 
            margin: 0;
            line-height: 1.38; /* Increased by 10% for improved breathing room */
        }

        /* Clean "back to images" navigation prompt sitting exactly two lines below */
        .back-link {
            color: #000;
            text-decoration: none;
            font-size: 11px;
            font-weight: 300; 
            letter-spacing: 1px;
            cursor: pointer;
            display: inline-block;
            margin-top: 25px; 
            line-height: 1.38; /* Increased by 10% for improved breathing room */
        }

        .back-link:hover {
            color: #666;
        }
    </style>

    <!-- CLEAN SECONDARY METADATA PAGE CONTAINER -->
    <div id="detail-view" onclick="hideArtworkPage(event)">
        <div class="detail-wrapper" onclick="event.stopPropagation()">
            <div class="artwork-container" id="media-target">
                <!-- Selected Video / Image scales dynamically inside here -->
                 
                <!-- Invisible tap pads layered directly on top of the image frame -->
                <div class="nav-zone nav-zone-left" onclick="navigateToAdjacentArtwork(event, -1)"></div>
                <div class="nav-zone nav-zone-right" onclick="navigateToAdjacentArtwork(event, 1)"></div>
            </div>
            <div class="artwork-details">
                <h1 id="title-target">Artwork Title</h1>
                <p id="info-target">Metadata detail parameters apply here cleanly.</p>
                <a onclick="hideArtworkPage(event)" class="back-link">back to images</a>
            </div>
        </div>
    </div>

    <!-- Seamless Subpage Transition Script Logic -->
    <script>
                 const archiveView = document.getElementById('archive-view');
        const detailView = document.getElementById('detail-view');
        const mediaTarget = document.getElementById('media-target');
        const titleTarget = document.getElementById('title-target');
        const infoTarget = document.getElementById('info-target');

        let currentArtworkIndex = 0;
        let allArtworkElements = [];

        function refreshArtworkList() {
            allArtworkElements = Array.from(document.querySelectorAll('.collage-grid > a, .collage-grid > video'));
        }

        function showArtworkPage(element, mediaType) {
            refreshArtworkList();
            currentArtworkIndex = allArtworkElements.indexOf(element);
            if (currentArtworkIndex === -1) currentArtworkIndex = 0;

            // Global Fallback Rule: Fixes images missing explicit layout parameters
            const detectedType = mediaType || (element.tagName.toLowerCase() === 'video' ? 'video' : 'image');
            loadArtworkData(element, detectedType);

            archiveView.style.display = 'none';
            window.scrollTo(0, 0);
            detailView.style.display = 'flex';
            setTimeout(() => {
                detailView.style.opacity = '1';
            }, 50);
        }

        function loadArtworkData(element) {
            let rawText = "";
            
            // Retains the interactive tap overlay zones while swapping out underlying image/video nodes
            const existingZones = mediaTarget.querySelectorAll('.nav-zone');
            
            if (element.tagName.toLowerCase() === 'video') {
                const source = element.querySelector('source');
                mediaTarget.innerHTML = `<video autoplay loop muted playsinline controls><source src="${source.src}" type="video/mp4"></video>`;
                rawText = element.getAttribute('data-title') || "Video Documentation Loop";
            } else {
                const img = element.querySelector('img');
                if (img) {
                    mediaTarget.innerHTML = `<img src="${img.src}" alt="Focus view">`;
                    rawText = img.alt || "Untitled";
                }
            }

            // Re-injects the invisible touch pads back over the fresh media element seamlessly
            existingZones.forEach(zone => mediaTarget.appendChild(zone));

            const textSegments = rawText.split('|');
            titleTarget.textContent = textSegments[0] ? textSegments[0].trim() : "Untitled";
            
            if (textSegments.length > 1) {
                const descriptions = textSegments.slice(1).map(item => item.trim());
                infoTarget.innerHTML = descriptions.join('<br>');
            } else {
                infoTarget.textContent = "";
            }
        }

        function navigateToAdjacentArtwork(event, direction) {
            if (event) event.stopPropagation(); // Prevents layout pop-back dismissals
            refreshArtworkList();

            // Computes adjacent pagination indexes securely; handles looping backwards cleanly past zero
            currentArtworkIndex = (currentArtworkIndex + direction + allArtworkElements.length) % allArtworkElements.length;
            const targetElement = allArtworkElements[currentArtworkIndex];

            loadArtworkData(targetElement);
            window.scrollTo(0, 0); // Centers scrolling index for vertical presentation rows
        }

        function hideArtworkPage(event) {
            if (event) event.preventDefault();
            
            detailView.style.opacity = '0';
            setTimeout(() => {
                detailView.style.display = 'none';
                
                // Flushes content safely while keeping the hardcoded navigation zones completely intact
                const zones = Array.from(mediaTarget.querySelectorAll('.nav-zone'));
                mediaTarget.innerHTML = '';
                zones.forEach(zone => mediaTarget.appendChild(zone));
                
                archiveView.style.display = 'block';
            }, 300);
        }
            </script>
