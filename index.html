<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Martyn Reynolds' Images</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #fff; /* Changed master fallback to white */
            overflow-x: hidden;
        }

        /* Container managing the structural swap between views */
        #archive-view {
            display: block;
            background-color: #fff; /* Ensures the background stays white during grid calculations */
        }

        .collage-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            grid-auto-rows: 150px;
            grid-auto-flow: dense;
            gap: 0; 
        }
        .collage-grid a,
        .collage-grid video {
            width: 100%;
            height: 100%;
            display: block;
            cursor: pointer;
            text-decoration: none;
        }
         /* Forces BOTH images and videos to scale and zoom identically */
        .collage-grid img,
        .collage-grid video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .wide { grid-column: span 2; }
        .tall { grid-row: span 2; }
        .big  { grid-column: span 2; grid-row: span 2; }

       /* PRESENTATION MAIN PORTFOLIO LAYOUT WINDOW */
        #detail-view {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #fff;
            z-index: 100000;
            box-sizing: border-box;
            font-family: sans-serif;
            opacity: 0;
            transition: opacity 0.3s ease;
            overflow-y: scroll; /* Forces standard vertical scrolling globally across the sub-page */
            -webkit-overflow-scrolling: touch; /* Ensures ultra-smooth momentum scrolling on iPad and iPhone */
        }

        /* REMOVED 100VH TO LET TALL ARTWORKS NATURALLY EXPAND DOWN THE PAGE BOUNDARIES */
        .gallery-split-wrapper {
            width: 100vw;
            min-height: 100vh;
            position: relative;
            display: block; /* Switches container type to allow items to stack down naturally */
        }

        .artwork-container {
            width: 100vw;
            max-width: 100vw;
            position: relative;
            display: flex;
            justify-content: center;
        }

        .artwork-container img, 
        .artwork-container video {
            width: 100vw; /* Perfect horizontal edge-to-edge presentation */
            height: auto;
            object-fit: contain;
            display: block;
        }

        /* FLOATS TEXT CONVENIENTLY IN THE CORNER MINIMALIST STYLE (NO WHITE BOX LAYER) */
        .artwork-details {
            text-align: right;
            box-sizing: border-box;
            padding: 0;
            position: fixed; /* Keeps text completely locked in place during zoom actions */
            bottom: 40px; 
            right: 40px; 
            width: auto;
            z-index: 200000 !important; /* Forces link text to hover above expanded image panels */
        }

        .artwork-details h1 {
            font-weight: 300; 
            font-size: 11px;
            font-style: italic; /* Your delicate italic title line style */
            letter-spacing: 1px;
            color: #000;
            margin: 0 0 4px 0;
            line-height: 1.38; 
        }

        .artwork-details p {
            color: #000;
            font-weight: 300; 
            font-size: 11px;
            letter-spacing: 1px; 
            margin: 0;
            line-height: 1.38; 
        }

        .back-link {
            color: #000;
            text-decoration: none;
            font-size: 11px;
            font-weight: 300; 
            letter-spacing: 1px;
            text-transform: lowercase; /* Your quiet lowercase link parameter */
            cursor: pointer !important;
            display: inline-block;
            margin-top: 25px; 
            line-height: 1.38; 
        }

        .back-link:hover { color: #666; }

        /* INVISIBLE CLICKOverlays LINK PATHS WITH ABSOLUTE PERSISTENT Z-INDEX TRACKING */
        .nav-zone {
            position: fixed; /* Switched to fixed to keep tracking vectors locked over screen halves */
            top: 0;
            width: 50%;
            height: 100%;
            z-index: 150000 !important;
        }
        
        /* Thin Black Gallery Cursors optimized cleanly for standard browser configurations */
        .nav-zone-left { 
            left: 0; 
            cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://w3.org" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="black" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>') 16 16, auto !important;
        }
        
        .nav-zone-right { 
            right: 0; 
            cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://w3.org" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="black" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>') 16 16, auto !important;
        }
        
        /* Stark, hair-thin minimalist screen-anchored arrow graphics */
        .screen-arrow {
            width: 32px;
            height: 32px;
            stroke: #000;
            stroke-width: 1.25; /* Your exact delicate hair-line thickness parameter */
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
            pointer-events: none; /* Allows clicks to pass through straight to the touch pads */
            opacity: 0.3; /* Quiet, elegant semi-transparent baseline opacity */
            transition: opacity 0.2s ease;
        }

        /* Subtle feedback cue when mouse hovers over a navigation half */
        .nav-zone:hover .screen-arrow {
            opacity: 1; /* Crisp full-contrast black highlight when active */
        }

        .arrow-left-offset { margin-left: 40px; }  /* Aligns with your 40px left margin line */
        .arrow-right-offset { margin-right: 40px; } /*

           /* Floats your text container cleanly in the bottom right corner of the window screen */
        .artwork-details {

        }

    <!-- SEAMLESS PRESENTATION LAYER MATRIX -->
    <div id="detail-view" onclick="hideArtworkPage(event)">
        <div class="gallery-split-wrapper" onclick="event.stopPropagation()">
            
            <!-- CORE PRESENTATION WINDOW HOUSING PORTFOLIO VIEWS -->
            <div class="artwork-container" id="media-target">
                <!-- Selected media loops scale natively edge-to-edge inside here -->
            </div>
            
            <!-- INVISIBLE TOUCH CHANNELS LOCKED SAFELY OVER THE LEFT/RIGHT SCREEN HALVES -->
            <div class="nav-zone nav-zone-left" onclick="navigateToAdjacentArtwork(event, -1)"></div>
            <div class="nav-zone nav-zone-right" onclick="navigateToAdjacentArtwork(event, 1)"></div>
            
            <!-- SAFELY ISOLATED FLOATING CORNER COLUMN DETAIL COUPLING -->
            <div class="artwork-details">
                <h1 id="title-target">Artwork Title</h1>
                <p id="info-target">Metadata details load cleanly here.</p>
                <a onclick="hideArtworkPage(event)" class="back-link">back to images</a>
            </div>
            
        </div>
    </div>

    <!-- Seamless Subpage Transition Script Logic -->
    <script>
         const archiveView = document.getElementById('archive-view');
        const detailView = document.getElementById('detail-view');
        const mediaTarget = document.getElementById('media-target');
        const titleTarget = document.getElementById('title-target');
        const infoTarget = document.getElementById('info-target');

        let currentArtworkIndex = 0;
        let allArtworkElements = [];

        function refreshArtworkList() {
            allArtworkElements = Array.from(document.querySelectorAll('.collage-grid > a, .collage-grid > video'));
        }

        function showArtworkPage(element, mediaType) {
            refreshArtworkList();
            currentArtworkIndex = allArtworkElements.indexOf(element);
            if (currentArtworkIndex === -1) currentArtworkIndex = 0;

            const detectedType = mediaType || (element.tagName.toLowerCase() === 'video' ? 'video' : 'image');
            loadArtworkData(element, detectedType);

            archiveView.style.display = 'none';
            window.scrollTo(0, 0);
            detailView.style.display = 'flex';
            setTimeout(() => {
                detailView.style.opacity = '1';
            }, 50);
        }

        function loadArtworkData(element, mediaType) {
            let rawText = "";
            const typeToCheck = mediaType || (element.tagName.toLowerCase() === 'video' ? 'video' : 'image');
            
            if (typeToCheck === 'video') {
                const source = element.querySelector('source');
                mediaTarget.innerHTML = `<video autoplay loop muted playsinline><source src="${source.src}" type="video/mp4"></video>`;
                rawText = element.getAttribute('data-title') || "Video Documentation Loop";
            } else {
                const img = element.querySelector('img');
                if (img) {
                    // Targets image magnification cleanly without scaling text layers
                    mediaTarget.innerHTML = `<img src="${img.src}" alt="Focus view" class="zoom-node" style="cursor: zoom-in; transition: transform 0.25s ease; transform-origin: center center;">`;
                    rawText = img.alt || "Untitled";

                    setTimeout(() => {
                        const zoomNode = mediaTarget.querySelector('.zoom-node');
                        if (zoomNode) {
                            let zoomed = false;
                            zoomNode.addEventListener('click', function(e) {
                                if (e.detail === 2) {
                                    e.stopPropagation();
                                    zoomed = !zoomed;
                                    zoomNode.style.transform = zoomed ? 'scale(2)' : 'scale(1)';
                                    zoomNode.style.cursor = zoomed ? 'zoom-out' : 'zoom-in';
                                }
                            });
                        }
                    }, 50);
                }
            }

            const textSegments = rawText.split('|');
            titleTarget.textContent = textSegments[0] ? textSegments[0].trim() : "Untitled";
            
            if (textSegments.length > 1) {
                const descriptions = textSegments.slice(1).map(item => item.trim());
                infoTarget.innerHTML = descriptions.join('<br>');
            } else {
                infoTarget.textContent = "";
            }
        }

        function navigateToAdjacentArtwork(event, direction) {
            if (event) event.stopPropagation();
            refreshArtworkList();

            currentArtworkIndex = (currentArtworkIndex + direction + allArtworkElements.length) % allArtworkElements.length;
            const targetElement = allArtworkElements[currentArtworkIndex];

            const detectedType = targetElement.tagName.toLowerCase() === 'video' ? 'video' : 'image';
            loadArtworkData(targetElement, detectedType);
            
            window.scrollTo(0, 0);
        }

        function hideArtworkPage(event) {
            if (event) event.preventDefault();
            detailView.style.opacity = '0';
            setTimeout(() => {
                detailView.style.display = 'none';
                mediaTarget.innerHTML = '';
                archiveView.style.display = 'block';
            }, 300);
        }
            </script>
