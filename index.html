   <style>
          body {
            margin: 0;
            padding: 0;
            background-color: #fff;
            overflow-x: hidden;
        }

        html { background-color: #fff; }

        /* Container managing the structural swap between views */
        #archive-view {
            display: block;
            background-color: #fff;
        }

        .collage-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            grid-auto-rows: 150px;
            /* dense: backfills empty cells left by tall/big images with later
               items so there are no gaps. Trade-off: a later page can end up
               visually before an earlier one when it fits a gap first. */
            grid-auto-flow: dense;
            gap: 0;
            background-color: #fff;
        }
        .collage-grid a,
        .collage-grid img,
        .collage-grid video {
            width: 100%;
            height: 100%;
            display: block;
        }
        .collage-grid a {
            cursor: pointer;
            text-decoration: none;
        }
        .collage-grid img,
        .collage-grid video {
            object-fit: cover;
        }
        .tall { grid-row: span 2; }
        .big  { grid-column: span 2; grid-row: span 2; }

        /* PRESENTATION MAIN PORTFOLIO LAYOUT WINDOW */
        /* Hide system cursor everywhere while the spinner is active */
        .spinner-loading, .spinner-loading * { cursor: none !important; }

        /* ── LOADING SPINNER ─────────────────────────────────────────── */
        #page-spinner {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 300000;
            color: #000;
            pointer-events: none;
            transition: color 0.2s ease;
            will-change: left, top;
        }
        #page-spinner.light-text { color: #fff; }
        #page-spinner svg { display: block; animation: spinner-rotate 1.4s linear infinite; }
        #page-spinner circle { animation: spinner-dash 1.4s ease-in-out infinite; }
        @keyframes spinner-rotate {
            from { transform: rotate(0deg); }
            to   { transform: rotate(360deg); }
        }
        @keyframes spinner-dash {
            0%   { stroke-dasharray: 1, 62.83;    stroke-dashoffset: 0; }
            50%  { stroke-dasharray: 47.12, 62.83; stroke-dashoffset: -18.85; }
            100% { stroke-dasharray: 1, 62.83;    stroke-dashoffset: -62.83; }
        }

        @keyframes mediaEnter {
            from { opacity: 0; transform: scale(0.96); }
            to   { opacity: 1; transform: scale(1); }
        }
        @keyframes slideFromRight {
            from { opacity: 0; transform: translateX(28px); }
            to   { opacity: 1; transform: translateX(0); }
        }
        @keyframes slideFromLeft {
            from { opacity: 0; transform: translateX(-28px); }
            to   { opacity: 1; transform: translateX(0); }
        }
        /* ANIMATIONS DISABLED — re-enable these three lines to restore
        #media-target.anim-enter { animation: mediaEnter    180ms ease-out both; }
        #media-target.anim-next  { animation: slideFromRight 240ms ease-out both; }
        #media-target.anim-prev  { animation: slideFromLeft  240ms ease-out both; }
        */

        #detail-view {
            display: none;
            /* Mobile (touch): position:absolute so iOS Safari treats this as
               document-flow content, which renders behind the translucent tab
               bar. position:fixed is constrained to the visual viewport
               between the toolbars and can't reach the physical screen edges. */
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            min-height: 100%;
            background-color: #fff;
            z-index: 100000;
            box-sizing: border-box;
            font-family: sans-serif;
            opacity: 0;
            transition: opacity 0.3s ease;
            overflow-y: scroll;
            -webkit-overflow-scrolling: touch;
            overscroll-behavior: contain;
            pointer-events: none;
            cursor: none;
        }

        /* Desktop: revert to position:fixed so the element is always
           viewport-sized. This is what makes overflow-y:scroll work for
           tall images (the element is height-constrained) and centres
           them via the scrollTop midpoint logic in applyMediaLayout. */
        @media (hover: hover) and (pointer: fine) {
            #detail-view {
                position: fixed;
                right: 0;
                bottom: 0;
                width: auto;
                min-height: unset;
            }
            /* Desktop grid: cells fill the row but have a minimum width,
               column count reflows on resize. Portrait unit min 100px,
               landscape/big span 2 units min 200px. */
            .collage-grid {
                grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
                grid-auto-rows: 360px;
            }
            .collage-grid > a:not(.tall),
            .collage-grid > video:not(.tall) {
                grid-column: span 2;
            }
            .tall { grid-column: span 1; grid-row: span 1; }
            .big  { grid-column: span 2; grid-row: span 1; }
            /* Page ends at last row — no extra min-height padding */
            .gallery-split-wrapper { min-height: 0; }
        }

        #detail-view.active-stage {
            pointer-events: auto;
        }
        /* Force cursor:none on all children during active detail view so a
           physical mouse click can't flash the system arrow — inline
           cursor:pointer!important set by JS on links/close-button still wins. */
        #detail-view.active-stage * {
            cursor: none !important;
        }

        .gallery-split-wrapper {
            width: 100vw;
            min-height: 100vh;
            position: relative;
            display: block;
        }

        .artwork-container {
            width: 100vw;
            max-width: 100vw;
            min-height: 100vh;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: flex-start; /* mobile: image anchored to top */
        }

        /* Desktop: vertically centre the image within the viewport */
        @media (hover: hover) and (pointer: fine) {
            .artwork-container {
                align-items: center;
            }
        }

        .artwork-container img,
        .artwork-container video {
            width: 100vw;
            height: auto;
            object-fit: contain;
            display: block;
            position: relative;
            z-index: 1; /* sits above the wrapper click zone */
            /* none: on mobile the image is always capped at max-height:100vh
               (see the mobile media query below), so it never needs native
               vertical scrolling at rest — there's nothing for pan-y to do
               except race our own touch handlers. With pan-y, the browser
               could commit to a native scroll/zoom gesture on the first
               finger before a second finger registers as a pinch, or fight
               our JS pan once zoomed in, making both gestures feel broken.
               touch-action: none hands every touch on the media fully to
               our JS, with no native gesture to contend with. */
            touch-action: none;
            /* NB: no static `will-change: transform`. A permanently-promoted
               layer is rasterised once at its on-screen (100vw) size and then
               GPU-upscaled when we scale() it — that is what made zoomed images
               look low-res. We toggle will-change ONLY during the live gesture
               (see JS) so the resting, zoomed image re-rasterises from the full
               source resolution and stays crisp. */
        }

        /* FLOATS TEXT CONVENIENTLY IN THE CORNER MINIMALIST STYLE */
        .artwork-details {
            text-align: right;
            box-sizing: border-box;
            padding: 0;
            margin-top: 0;
            position: fixed; 
            bottom: 18px;
            right: 18px;
            width: calc(100vw - 36px);
            z-index: 200000 !important;
            pointer-events: auto;
            transition: color 0.2s ease;
        }

        .page-number {
            position: fixed;
            top: 18px;
            left: 18px;
            z-index: 200000 !important;
            pointer-events: none;
            font-size: 11px;
            font-weight: 300;
            font-style: normal;
            letter-spacing: 1px;
            line-height: 1.38;
            color: #000;
            transition: color 0.2s ease;
        }

        .page-number.light-text {
            color: #fff !important;
        }

        /* Close button — same type treatment as .page-number, mirrored to
           the top-right corner, and independently light/dark like the page
           number and detail text (see applyTextColour). Unlike the page
           number it's interactive, so it needs pointer-events/cursor. */
        .close-button {
            position: fixed;
            /* Hit area extends to the screen corner (top-right) with equal
               padding on all four sides — the X glyph sits at 18px from
               the corner, matching its previous visual position. */
            top: 0;
            right: 0;
            padding: 18px;
            z-index: 200000 !important;
            pointer-events: auto;
            cursor: pointer;
            font-size: 11px;
            font-weight: 130; /* +30% from original 100 */
            /* Match the <> nav-arrow's font stack — its thin stroke comes
               from this specific system font at weight 100, not just the
               weight value, which a generic sans-serif fallback renders
               heavier. */
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
            text-rendering: optimizeLegibility;
            -webkit-font-smoothing: antialiased;
            font-style: normal;
            letter-spacing: 1px;
            line-height: 1.38;
            color: #000;
            transition: color 0.2s ease;
        }

        .close-button-glyph {
            /* The glyph alone renders taller than wide; stretch it
               partway toward square, anchored to the right edge so it
               stays visually put. This transform lives on the inner
               glyph, not the hoverable .close-button itself. */
            display: inline-block;
            transform: scaleX(1.2);
            transform-origin: 100% 50%;
        }

        .close-button.light-text {
            color: #fff !important;
        }

        .close-button:hover {
            color: #666;
        }

        .close-button.light-text:hover {
            color: rgba(255, 255, 255, 0.5) !important;
        }

        /* Sound toggle — shown inline in the caption for videos that opt into
           audio. Same minimal treatment as the link icon and the X: thin, sits
           in the text flow and inherits the caption's light/dark colour. */
        .mute-toggle {
            display: inline;
            vertical-align: middle;
            cursor: pointer;
            color: inherit;
        }
        .mute-toggle svg {
            display: inline-block;
            vertical-align: middle;
            position: relative;
            top: -2px;
            width: 15px;
            height: 15px;
        }
        .artwork-details .mute-toggle:hover { color: #666; }
        .artwork-details.light-text .mute-toggle:hover { color: rgba(255, 255, 255, 0.5) !important; }

        @media screen and (max-width: 900px), (hover: none) and (pointer: coarse) {
            .artwork-details {
                bottom: calc(env(safe-area-inset-bottom, 0px) + 18px);
                left: 18px;
                right: 18px;
                width: auto;
                text-align: center;
            }
            .artwork-details h1,
            .artwork-details p {
                width: fit-content !important;
                margin-left: auto !important;
                margin-right: auto !important;
                text-align: center !important;
            }
            .artwork-details .info-seg {
                display: block;
            }
            .artwork-container img,
            .artwork-container video {
                max-width: 100vw !important;
                max-height: 100vh !important;
                width: auto !important;
                height: auto !important;
            }
        }

        /* When the user is actively pinch-zooming, hide page overflow so
           the scroll container doesn't interfere with the gesture. */
        #detail-view.zooming {
            overflow: hidden !important;
        }

        .artwork-details.light-text h1,
        .artwork-details.light-text p {
            color: #fff !important;
        }

        .artwork-details h1 {
            font-weight: 300;
            font-size: 11px;
            font-style: italic;
            letter-spacing: 1px;
            color: #000;
            margin: 0;
            margin-left: auto;
            width: fit-content;
            line-height: 1.38;
        }

        .artwork-details .title-roman {
            font-style: normal;
        }

        .artwork-details p {
            color: #000;
            font-weight: 300;
            font-size: 11px;
            letter-spacing: 1px;
            margin: 0;
            margin-left: auto;
            width: fit-content;
            line-height: 1.38;
        }

        .artwork-details a {
            color: inherit;
            text-decoration: none;
            pointer-events: auto;
            cursor: pointer !important;
        }

        .link-icon {
            vertical-align: middle;
            display: inline;
        }

        .artwork-details a:hover {
            color: #666;
        }

        .artwork-details.light-text a:hover {
            color: rgba(255, 255, 255, 0.5) !important;
        }

        /* The whole caption is one link: hovering any of its text greys all of
           it, matching the inline link hover. Toggled from JS (desktop only). */
        .artwork-details.hover-link h1,
        .artwork-details.hover-link p {
            color: #666;
        }
        .artwork-details.light-text.hover-link h1,
        .artwork-details.light-text.hover-link p {
            color: rgba(255, 255, 255, 0.5) !important;
        }

        /* A video caption is descriptive, not an artwork title — no italics. */
        .artwork-details.video-caption h1 {
            font-style: normal;
        }

        /* MINIMAL FLAT ARROW INDICATOR — desktop only, follows the cursor.
           Its colour is set in JS by sampling the image tone directly behind
           the cursor — the same brightness feature that drives the text block. */
        .nav-arrow {
            display: none; /* hidden on mobile / touch */
            position: fixed;
            top: 0;
            left: 0;
            transform: translate(-50%, -50%);
            z-index: 250000;
            pointer-events: none; /* never intercept clicks */
            opacity: 0;
            transition: opacity 0.15s ease;
            line-height: 1;
            font-size: 21px;
            letter-spacing: 0;
            font-weight: 100;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
            color: #000;
            text-rendering: optimizeLegibility;
            -webkit-font-smoothing: antialiased;
            text-transform: none;
            will-change: left, top, color;
        }

        /* Desktop-only: show the cursor-tracking arrow indicator. Cursor
           visibility itself (none over media, pointer over links) is set
           directly in JS on every mousemove (see handleDetailMouseMove) —
           toggling it via a CSS class on an ancestor proved unreliable
           across browsers (Safari kept showing the native arrow over
           links; Chrome sometimes showed native arrow + custom arrow at
           once), so the cursor style is now written straight onto the
           element under the pointer instead. */
        @media (hover: hover) and (pointer: fine) {
            .nav-arrow { display: block; }

            /* Desktop: single long line, lower-left */
            .artwork-details {
                text-align: left;
                left: 18px;
                right: unset;
                white-space: nowrap;
            }
            .artwork-details h1 {
                display: inline;
                margin-left: 0;
                width: auto;
            }
            .artwork-details:has(#info-target:not(:empty)) h1::after {
                content: ", ";
                font-style: normal;
            }
            .artwork-details p {
                display: inline;
                margin-left: 0;
                width: auto;
            }
            .artwork-details .info-seg {
                display: inline;
            }
            .artwork-details .info-seg + .info-seg::before {
                content: ", ";
            }
        }

    </style>

   <!-- CLEAN SEPARATED METADATA PRESENTATION STAGE CONTAINER -->
    <!-- A single click handler decides: a click on the image navigates (left /
         right half), a click on the surrounding white space returns to grid. -->
    <div id="detail-view" onclick="handleDetailClick(event)">
        <div class="gallery-split-wrapper">

            <div class="artwork-container" id="media-target">
                <!-- Image / video inserted here at run time -->
            </div>

            <div class="page-number" id="page-number">1</div>
            <div class="close-button" id="close-button" onclick="hideArtworkPage(event)"><span class="close-button-glyph">X</span></div>
            <div class="artwork-details" onclick="handleDetailsClick(event)">
                <h1 id="title-target">Artwork Title</h1>
                <p id="info-target">Metadata text column entries apply cleanly here.</p>
            </div>

        </div>
    </div>

    <!-- MINIMAL FLAT ARROW INDICATORS (desktop only, follow the cursor) -->
    <div class="nav-arrow" id="arrow-left">&lt;</div>
    <div class="nav-arrow" id="arrow-right">&gt;</div>

    <script>
        const archiveView    = document.getElementById('archive-view');
        const detailView     = document.getElementById('detail-view');
        const mediaTarget    = document.getElementById('media-target');
        const titleTarget    = document.getElementById('title-target');
        const infoTarget     = document.getElementById('info-target');
        const artworkDetails = document.querySelector('.artwork-details');

        // Page order is defined purely by element order in the static HTML
        // (see the data-page comments on each cms-item); nothing here
        // reorders the DOM at runtime.

        let currentArtworkIndex = 0;
        let allArtworkElements = [];

        function refreshArtworkList() {
            allArtworkElements = Array.from(document.querySelectorAll('.collage-grid > a, .collage-grid > video'));
        }

        // Native pointer cursor for grid links — the browser's own hand
        // icon (already a white glove with a black outline on most
        // systems). CSS already declares cursor:pointer on .collage-grid a;
        // force it via direct inline !important write too, since plain
        // stylesheet cursor rules have proven unreliable to actually paint
        // across browsers elsewhere on this page.
        document.querySelectorAll('.collage-grid > a').forEach(a => {
            a.style.setProperty('cursor', 'pointer', 'important');
        });

        function isDesktop() {
            return window.matchMedia('(hover: hover) and (pointer: fine)').matches;
        }

        // True when the cursor (cx, cy) sits within the rendered media bounds.
        function isPointOverMedia(mediaEl, cx, cy) {
            if (!mediaEl) return false;
            const r = mediaEl.getBoundingClientRect();
            return cx >= r.left && cx <= r.right && cy >= r.top && cy <= r.bottom;
        }

        // Like isPointOverMedia, but a desktop pillarboxed video also counts its
        // left/right white bars as navigable — so the < > arrows appear there and
        // a click navigates, instead of the bars reading as "return to grid".
        function isPointNavigable(mediaEl, cx, cy) {
            if (!mediaEl) return false;
            const r = mediaEl.getBoundingClientRect();
            if (isDesktop() && mediaEl.tagName.toLowerCase() === 'video') {
                return cy >= r.top && cy <= r.bottom;
            }
            return cx >= r.left && cx <= r.right && cy >= r.top && cy <= r.bottom;
        }

        // ─────────────────────────────────────────────────────────────────
        // INITIAL LAYOUT PER DEVICE + IMAGE ORIENTATION
        //   • Desktop: vertical images that overflow open scrolled to centre.
        //   • Mobile portrait images: top edge aligned to the top of the screen.
        //   • Mobile landscape images: centred vertically on the screen.
        // Called once the media has loaded (so its natural size is known).
        // ─────────────────────────────────────────────────────────────────
        function applyMediaLayout(mediaEl) {
            const w = mediaEl.naturalWidth  || mediaEl.videoWidth  || 0;
            const h = mediaEl.naturalHeight || mediaEl.videoHeight || 0;

            if (isDesktop()) {
                const vw = window.innerWidth;
                const vh = window.innerHeight;
                const isWide = w > 0 && h > 0 && (w / h) > (vw / vh);
                const isVideo = mediaEl.tagName.toLowerCase() === 'video';
                if (isVideo && !isWide) {
                    // Portrait video: fill screen height (top edge to bottom
                    // edge) and let it be as wide as it is. The container stays
                    // full-viewport-width and flex-centres the video, so the
                    // white page shows as left/right pillarbox. No scrolling.
                    mediaEl.style.height = '100vh';
                    mediaEl.style.width  = 'auto';
                    mediaTarget.style.width    = '';
                    mediaTarget.style.maxWidth = '';
                    mediaTarget.style.alignItems = 'center';
                    detailView.style.overflowY = 'hidden';
                    detailView.style.overflowX = 'hidden';
                    requestAnimationFrame(() => {
                        detailView.scrollLeft = 0;
                        detailView.scrollTop  = 0;
                    });
                } else if (isWide) {
                    // Wide/landscape: fill screen height and scroll horizontally,
                    // opening scrolled to the centre.
                    mediaEl.style.height = '100vh';
                    mediaEl.style.width  = 'auto';
                    mediaTarget.style.width    = 'fit-content';
                    mediaTarget.style.maxWidth = 'none';

                } else {

                    mediaEl.style.height = '';
                    mediaEl.style.width  = '';
                    mediaTarget.style.width    = '';
                    mediaTarget.style.maxWidth = '';
                    mediaTarget.style.alignItems = 'center';
                    detailView.style.overflowY = 'scroll';
                    detailView.style.overflowX = 'hidden';
                    requestAnimationFrame(() => {
                        const maxScroll = detailView.scrollHeight - detailView.clientHeight;

                const capTop = artworkDetails.getBoundingClientRect().top;

        // link icon — the same minimal, colour-inheriting treatment.
        // ─────────────────────────────────────────────────────────────────
        const SPEAKER_ON = `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/><g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M16 8.6a4 4 0 0 1 0 6.8"/><path d="M18.7 6a7 7 0 0 1 0 12"/></g></svg>`;

            `&ensp;&ensp;<span class="mute-toggle" id="mute-button" role="button" aria-label="Toggle sound" onclick="toggleMute(event)">${muted ? SPEAKER_OFF : SPEAKER_ON}</span>`;

            const el = document.getElementById('mute-button');
            if (el) el.innerHTML = muted ? SPEAKER_OFF : SPEAKER_ON;
        }

        function toggleMute(event) {
            // preventDefault stops the surrounding caption link from opening;
            // stopPropagation stops the click from closing the detail view.
            if (event) { event.preventDefault(); event.stopPropagation(); }
            const v = mediaTarget.querySelector('video');
            if (!v) return;
            v.muted = !v.muted;
            if (!v.muted) v.play().catch(() => {});

        // ─────────────────────────────────────────────────────────────────
        // CANVAS BRIGHTNESS SAMPLING
        // Shared core — pass any HTMLImageElement or HTMLVideoElement.
        // Returns average luminance (0–255) of the bottom-right patch,
        // or null if sampling failed (CORS, not ready, etc.)
        // ─────────────────────────────────────────────────────────────────
        // Generic: average luminance (0–255) of the image region under a
        // screen-space rectangle (sx, sy, sw, sh). Returns null if it can't
        // sample (cursor off the image, not loaded, CORS, etc.).
        function sampleLuminanceAtScreenRect(mediaEl, sx, sy, sw, sh) {
            try {
                const rect = mediaEl.getBoundingClientRect();
                let naturalW, naturalH;
                if (mediaEl.tagName.toLowerCase() === 'video') {
                    naturalW = mediaEl.videoWidth;
                    naturalH = mediaEl.videoHeight;
                } else {
                    naturalW = mediaEl.naturalWidth;
                    naturalH = mediaEl.naturalHeight;
                }
                if (!naturalW || !naturalH || rect.width <= 0 || rect.height <= 0) return null;

                const scaleX = naturalW / rect.width;
                const scaleY = naturalH / rect.height;

                // Intersect the screen rect with the media rect.
                const left   = Math.max(sx, rect.left);
                const right  = Math.min(sx + sw, rect.right);
                const top    = Math.max(sy, rect.top);
                const bottom = Math.min(sy + sh, rect.bottom);
                if (right <= left || bottom <= top) return null;

                const srcX = (left - rect.left) * scaleX;
                const srcY = (top  - rect.top)  * scaleY;
                const srcW = (right - left) * scaleX;
                const srcH = (bottom - top)  * scaleY;

                const outW = 24, outH = 16;
                const canvas = document.createElement('canvas');
                canvas.width = outW;
                canvas.height = outH;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(mediaEl, srcX, srcY, srcW, srcH, 0, 0, outW, outH);
                const data = ctx.getImageData(0, 0, outW, outH).data;

                let total = 0;
                const pixels = outW * outH;
                for (let i = 0; i < data.length; i += 4) {
                    total += 0.2126 * data[i] + 0.7152 * data[i+1] + 0.0722 * data[i+2];
                }
                return total / pixels;
            } catch(e) {
                return null;

        // region actually behind IT — the details block (bottom-right), the
        // page number (top-left), and the close button (top-right) all sit
        // over different parts of the image and can need opposite colours.
        function applyTextColour(detailsLuminance, pageNumberLuminance, closeButtonLuminance) {
            // Threshold raised from 128 to 154 (~20% toward white): white text
            // on dark and medium-dark backgrounds; only clearly light backgrounds
            // get black text. The inline mute toggle lives inside the details
            // block and inherits its colour automatically.
            document.getElementById('page-number').classList.toggle('light-text',

                closeButtonLuminance !== null && closeButtonLuminance < 154);
            artworkDetails.classList.toggle('light-text',

        // ─────────────────────────────────────────────────────────────────

        // getBoundingClientRect() is far wider than the actual right-aligned

        // over. Union just the visible text children's rects instead.
        function visibleTextRect(container) {
            const children = Array.from(container.children).filter(el => el.textContent.trim() !== '');
            if (children.length === 0) return container.getBoundingClientRect();
            const rects = children.map(el => el.getBoundingClientRect());
            const left = Math.min(...rects.map(r => r.left));
            const top = Math.min(...rects.map(r => r.top));
            const right = Math.max(...rects.map(r => r.right));
            const bottom = Math.max(...rects.map(r => r.bottom));
            return { left, top, right, bottom, width: right - left, height: bottom - top };

            brightnessLoopActive = true;
            lastBrightnessSample = 0;

                if (!brightnessLoopActive) return;

                }
            }

        }

        // Quietly fetch the surrounding full-res originals so stepping
        // through the slideshow feels instant, without downloading the
        // entire (400MB+) gallery up front for visitors who only look at
        // the grid. fetchPriority 'low' keeps these from competing with
        // whatever the user is actually waiting on right now. Videos are
        // skipped — they're large and load fine on demand when opened.
        const preloadedArtwork = new Set();
        function preloadAdjacentArtwork() {
            if (allArtworkElements.length < 2) return;
            [1, 2, 3, -1, -2].forEach(direction => {
                const idx = (currentArtworkIndex + direction + allArtworkElements.length) % allArtworkElements.length;
                const el = allArtworkElements[idx];
                if (el.tagName.toLowerCase() === 'video') return;
                const file = el.getAttribute('data-file');
                if (!file || preloadedArtwork.has(file)) return;
                preloadedArtwork.add(file);
                const img = new Image();
                img.fetchPriority = 'low';
                img.src = file;
            });
        }

        // Preload the first 10 full-res images after the page has fully loaded
        // and settled, so initial grid thumbnail loading is not competed with.
        // Hide the grid-view spinner once the images currently on screen have loaded.
        // Only watches images in or near the viewport — ignores the rest of the grid.
        (function watchVisibleGridImages() {
            const spinner = document.getElementById('page-spinner');
            const done = () => {
                spinner.style.display = 'none';
                document.body.classList.remove('spinner-loading');
            };
            const imgs = Array.from(
                document.querySelectorAll('.collage-grid img')
            ).slice(0, 40); // check first 40 — more than enough for any viewport
            const vh = window.innerHeight;
            const visible = imgs.filter(img => img.getBoundingClientRect().top < vh + 100);
            if (!visible.length) { done(); return; }
            let pending = 0;
            const dec = () => { if (--pending === 0) done(); };
            visible.forEach(img => {
                if (img.complete && img.naturalWidth > 0) return;
                pending++;
                img.addEventListener('load',  dec, { once: true });
                img.addEventListener('error', dec, { once: true });
            });
            if (pending === 0) done();
            else setTimeout(done, 6000); // failsafe
        })();

        window.addEventListener('load', function() {
            setTimeout(function() {
                refreshArtworkList();
                allArtworkElements.slice(0, 10).forEach(function(el) {
                    if (el.tagName.toLowerCase() === 'video') return;
                    const file = el.getAttribute('data-file');
                    if (!file || preloadedArtwork.has(file)) return;
                    preloadedArtwork.add(file);
                    const img = new Image();
                    img.fetchPriority = 'low';
                    img.src = file;
                });
            }, 3000);
        });

        function navigateToAdjacentArtwork(event, direction) {
            if (event) event.stopPropagation();
            if (isPinching) return;
            window.resetImageZoom();
            refreshArtworkList();

            currentArtworkIndex = (currentArtworkIndex + direction + allArtworkElements.length) % allArtworkElements.length;
            const targetElement = allArtworkElements[currentArtworkIndex];

            const detectedType = targetElement.tagName.toLowerCase() === 'video' ? 'video' : 'image';
            loadArtworkData(targetElement, detectedType);
        }

        // Blocks page scroll while the detail view is open without using
        // overflow:hidden (which would clip the element at the visual viewport
        // boundary, preventing it from reaching behind iOS Safari's tab bar).
        // Allows scroll within #detail-view itself so tall images still scroll.
        function _blockBodyScroll(e) {
            if (!detailView.contains(e.target)) e.preventDefault();
        }

        function hideArtworkPage(event) {
            if (event) {
                event.preventDefault();
                if (event.stopPropagation) event.stopPropagation();
            }
            stopBrightnessLoop();
            hideArrows();
            document.getElementById('page-spinner').style.display = 'none';
            detailView.classList.remove('spinner-loading');
            window.resetImageZoom();
            detailView.style.opacity = '0';
            detailView.classList.remove('active-stage');
            detailView.classList.remove('over-media');
            detailView.style.cursor = '';

            setTimeout(() => {
                detailView.style.display = 'none';
                detailView.style.overflowY = '';
                detailView.style.overflowX = '';
                mediaTarget.style.width    = '';
                mediaTarget.style.maxWidth = '';
                if (!isDesktop()) {
                    detailView.style.minHeight = '';
                    document.body.style.minHeight = '';
                    document.removeEventListener('touchmove', _blockBodyScroll);
                }
                mediaTarget.innerHTML = '';
                archiveView.style.display = 'block';

                if (allArtworkElements[currentArtworkIndex]) {
                    allArtworkElements[currentArtworkIndex].scrollIntoView({ block: 'center', behavior: 'auto' });
                }
            }, 300);
        }

        // ─────────────────────────────────────────────────────────────────
        // KEYBOARD
        // ─────────────────────────────────────────────────────────────────
        window.addEventListener('keydown', function(event) {
            if (detailView.style.display === 'block') {
                if      (event.key === 'ArrowRight' || event.key === 'ArrowDown') navigateToAdjacentArtwork(event, 1);
                else if (event.key === 'ArrowLeft'  || event.key === 'ArrowUp')   navigateToAdjacentArtwork(event, -1);
                else if (event.key === 'Escape') hideArtworkPage(event);
            }
        });

        // ─────────────────────────────────────────────────────────────────
        // TOUCH SWIPE — blocked when pinching
        // ─────────────────────────────────────────────────────────────────
        let touchStartX = 0;
        let touchEndX = 0;

        detailView.addEventListener('touchstart', function(event) {
            if (event.touches.length === 1) {
                touchStartX = event.changedTouches[0].screenX;
            }
        }, { passive: true });

        detailView.addEventListener('touchend', function(event) {
            if (isPinching) return;
            if (event.touches.length === 0) {
                touchEndX = event.changedTouches[0].screenX;
                handleSwipeGesture(event);
            }
        }, { passive: true });

        function handleSwipeGesture(event) {
            if (isPinching || isImageZoomed) return; // a swipe while zoomed is a pan, not navigation
            const swipeDistance = touchEndX - touchStartX;
            const thresholdPixelGap = 50;

            if (Math.abs(swipeDistance) > thresholdPixelGap) {
                if (swipeDistance < 0) navigateToAdjacentArtwork(event, 1);
                else navigateToAdjacentArtwork(event, -1);
            }
            touchStartX = 0;
            touchEndX = 0;
        }

        // ─────────────────────────────────────────────────────────────────
        // ORIENTATION CHANGE — brightness loop handles it automatically,
        // but we force an immediate re-check on rotation
        // ─────────────────────────────────────────────────────────────────
        window.matchMedia('(orientation: portrait)').addEventListener('change', function() {
            setTimeout(() => {
                if (brightnessLoopActive) lastBrightnessSample = 0; // force immediate resample
            }, 150);
        });

        // ─────────────────────────────────────────────────────────────────
        // CLICK ROUTING (desktop + mobile)
        //   • Click on the image  → navigate (left half = previous, right = next)
        //   • Click on white space → return to the image grid
        // This reconciles points 3 & 4: the arrows live over the image, and the
        // surrounding white space is the "return to grid" button.
        // ─────────────────────────────────────────────────────────────────
        function handleDetailClick(event) {
            if (isPinching) return;
            const mediaEl = mediaTarget.querySelector('img, video');
            if (mediaEl && isPointNavigable(mediaEl, event.clientX, event.clientY)) {
                // Use screen centre, not image centre — when panned or zoomed
                // the image centre can be off-screen, so image-relative left/
                // right doesn't match what the user perceives as left/right.
                const dir = event.clientX < (detailView.clientWidth / 2) ? -1 : 1;
                navigateToAdjacentArtwork(event, dir);
            } else {
                hideArtworkPage(event);
            }
        }

        // ─────────────────────────────────────────────────────────────────
        // CURSOR-TRACKING ARROW INDICATOR — desktop only
        // The arrow follows the cursor over the image, points in the direction
        // navigation will go, and flips black/white against the tone directly
        // behind it (the same luminance sampling that drives the text block).
        // ─────────────────────────────────────────────────────────────────
        const arrowLeft  = document.getElementById('arrow-left');
        const arrowRight = document.getElementById('arrow-right');
        let lastArrowSample = 0;
        let lastArrowColour = '#000';

        function hideArrows() {
            arrowLeft.style.opacity  = '0';
            arrowRight.style.opacity = '0';
        }

        // Clears any cursor we forced directly onto the link/close-button —
        // called whenever the pointer is NOT over one of them, so a stale
        // inline override never lingers on an element the mouse has left.
        let _lastElAtPoint = null;
        function clearInteractiveCursors() {
            const link = artworkDetails.querySelector('a');
            if (link) link.style.removeProperty('cursor');
            document.getElementById('close-button').style.removeProperty('cursor');
            if (_lastElAtPoint) { _lastElAtPoint.style.removeProperty('cursor'); _lastElAtPoint = null; }
        }

        function handleDetailMouseMove(event) {
            if (!isDesktop()) return;
            if (detailView.classList.contains('spinner-loading')) return;
            const mediaEl = mediaTarget.querySelector('img, video');

            // When hovering a metadata link or the close button, show the
            // hand cursor, not the nav arrow. Written directly onto that
            // specific element (not just the detailView ancestor) — Safari
            // has proven unreliable about painting a cursor that's only
            // set via an ancestor while a sibling/descendant disagrees.
            const elAtPoint = document.elementFromPoint(event.clientX, event.clientY);
            let hoveredInteractive = elAtPoint && elAtPoint.closest('.artwork-details a, .close-button');
            // Desktop: the whole caption text block is the link, so any text in
            // it (not the empty band) gets the hand cursor too.
            if (!hoveredInteractive && currentCaptionUrl && elAtPoint &&
                elAtPoint.closest('.artwork-details') && elAtPoint !== artworkDetails) {
                hoveredInteractive = elAtPoint;
            }
            // Grey the whole caption while hovering any of its text (link).
            artworkDetails.classList.toggle('hover-link', !!(currentCaptionUrl && elAtPoint &&
                elAtPoint.closest('.artwork-details') && elAtPoint !== artworkDetails &&
                !elAtPoint.closest('.mute-toggle')));
            if (hoveredInteractive) {
                detailView.classList.remove('over-media');
                detailView.style.cursor = '';
                if (mediaEl) mediaEl.style.removeProperty('cursor');
                hoveredInteractive.style.setProperty('cursor', 'pointer', 'important');
                // Also set on the exact element under the pointer — our CSS rule
                // cursor:none!important applies to all descendants, so the child
                // element under the cursor needs its own inline override.
                if (elAtPoint && elAtPoint !== hoveredInteractive) {
                    elAtPoint.style.setProperty('cursor', 'pointer', 'important');
                }
                _lastElAtPoint = elAtPoint;
                hideArrows();
                return;
            }
            clearInteractiveCursors();

            // Anywhere else that ISN'T actually over the media (white space,
            // page-number corner, the artwork-details padding around the
            // text) should show the normal arrow cursor and no nav arrow —
            // clicking there returns to the grid, it doesn't navigate.
            if (!mediaEl || !isPointNavigable(mediaEl, event.clientX, event.clientY)) {
                detailView.classList.remove('over-media');
                detailView.style.cursor = '';
                if (mediaEl) mediaEl.style.removeProperty('cursor');
                hideArrows();
                return;
            }

            // Hide the native cursor in favour of the custom <> indicator.
            // Written directly onto the media element itself, not just the
            // detailView ancestor — Chrome has shown both the native arrow
            // and the custom indicator at once when the override only lived
            // on a parent.
            detailView.classList.add('over-media');
            mediaEl.style.setProperty('cursor', 'none', 'important');
            const rect = mediaEl.getBoundingClientRect();
            const overPixels = event.clientX >= rect.left && event.clientX <= rect.right &&
                               event.clientY >= rect.top  && event.clientY <= rect.bottom;
            const goLeft = event.clientX < (rect.left + rect.width / 2);
            const active = goLeft ? arrowLeft : arrowRight;
            const other  = goLeft ? arrowRight : arrowLeft;

            other.style.opacity = '0';
            active.style.left = event.clientX + 'px';
            active.style.top  = event.clientY + 'px';
            active.style.opacity = '1';

            if (!overPixels) {
                // Over the white pillarbox beside a video: black arrow on white.
                lastArrowColour = '#000';
            } else if (event.timeStamp - lastArrowSample > 80) {
                // Throttle the (relatively costly) luminance sample to ~12/sec.
                lastArrowSample = event.timeStamp;
                const lum = sampleLuminanceAtScreenRect(
                    mediaEl, event.clientX - 20, event.clientY - 12, 40, 24);
                if (lum !== null) lastArrowColour = lum < 154 ? '#fff' : '#000';
            }
            active.style.color = lastArrowColour;
        }

        // Spinner follows the cursor globally
        const _spinner = document.getElementById('page-spinner');
        let _spinnerLumTs = 0;
        document.addEventListener('mousemove', function(e) {
            _spinner.style.left = e.clientX + 'px';
            _spinner.style.top  = e.clientY + 'px';

            if (_spinner.style.display === 'none') return;
            // Throttle luminance sampling to ~12 checks/sec (same as arrows)
            if (e.timeStamp - _spinnerLumTs < 80) return;
            _spinnerLumTs = e.timeStamp;

            // Sample the image under the cursor: old image in detail view,
            // or the grid thumbnail under the pointer during page load.
            let mediaEl = mediaTarget.querySelector('img, video');
            if (!mediaEl) {
                const el = document.elementFromPoint(e.clientX, e.clientY);
                if (el && el.tagName === 'IMG') mediaEl = el;
            }
            if (mediaEl) {
                const lum = sampleLuminanceAtScreenRect(
                    mediaEl, e.clientX - 12, e.clientY - 12, 24, 24);
                _spinner.classList.toggle('light-text', lum !== null && lum < 154);
            } else {
                _spinner.classList.remove('light-text');
            }
        });

        detailView.addEventListener('mousemove', handleDetailMouseMove);
        detailView.addEventListener('mouseleave', () => {
            detailView.classList.remove('over-media');
            artworkDetails.classList.remove('hover-link');
            detailView.style.cursor = '';
            const mediaEl = mediaTarget.querySelector('img, video');
            if (mediaEl) mediaEl.style.removeProperty('cursor');
            clearInteractiveCursors();
            hideArrows();
        });

        // ─────────────────────────────────────────────────────────────────
        // PINCH-TO-ZOOM — image only, so the text block stays locked
        //
        // Native page pinch-zoom is a compositor operation: the browser scales
        // the already-painted layer (text included) and won't repaint during
        // the gesture, so JS can never hold a fixed element still against it
        // (and iOS ignores user-scalable=no outright). Instead we suppress the
        // browser's own pinch and run our own: only the <img>/<video> gets a
        // CSS transform, so the text — a separate fixed sibling — never moves.
        // ─────────────────────────────────────────────────────────────────
        (function customPinchZoom() {
            const container = document.getElementById('media-target');
            if (!container) return;

            let scale = 1, tx = 0, ty = 0;     // current transform of the media
            let startDist = 0, startScale = 1; // pinch baseline
            let startTx = 0, startTy = 0;
            let panStartX = 0, panStartY = 0;
            let panTapX = 0, panTapY = 0;      // finger position at pan start (tap detection)
            let startRectL = 0, startRectT = 0; // media rect at gesture start
            let mode = null;                   // 'pinch' | 'pan' | null
            // Cached element layout position (excluding transform) and CSS
            // dimensions at scale=1. Updated at every gesture start so apply()
            // can clamp without any DOM reads mid-gesture.
            let elLayoutL = 0, elLayoutT = 0, elW0 = 0, elH0 = 0;

            function media() { return container.querySelector('img, video'); }

            // Lock width to the live visualViewport measurement so iOS
            // Safari's toolbar show/hide (which vw units don't track)
            // doesn't leave a sliver gap at the right edge while zoomed.
            // Height is intentionally left as `auto` — forcing a fixed
            // viewport height created an element taller than the image
            // content, which (a) caused a visible jump at gesture start
            // when object-fit switched from contain to cover, and (b)
            // let the user pan into the empty space below the image.
            function lockMediaToViewport() {
                const el = media();
                if (!el) return;
                const vw = window.screen.width || detailView.clientWidth || window.innerWidth;
                el.style.setProperty('width', vw + 'px', 'important');
            }
            function unlockMediaSize() {
                const el = media();
                if (!el) return;
                el.style.removeProperty('width');
            }

            // apply(skipClamp)
            // skipClamp=true during active two-finger pinch: the focal-point
            // maths already position the image correctly; applying threshold-
            // based clamps mid-gesture causes a visible jump every time the
            // image height crosses innerHeight or screen.height.
            // skipClamp=false (default) during pan and at gesture end: clamp
            // so the user can't drag the image off-screen.
            function apply(skipClamp) {
                const el = media();
                if (!el) return;
                if (scale <= 1.001) {
                    scale = 1; tx = 0; ty = 0;
                    el.style.transform = '';
                    el.style.transformOrigin = '';
                    el.style.willChange = 'auto';
                    isImageZoomed = false;
                } else {
                    if (!skipClamp) {
                        const vw  = window.screen.width  || window.innerWidth;
                        const vh  = window.screen.height || window.innerHeight;
                        const vhv = window.innerHeight;
                        const curW = elW0 * scale;
                        const curH = elH0 * scale;
                        let vL = elLayoutL + tx;
                        let vT = elLayoutT + ty;
                        if (curW >= vw) {
                            if (vL > 0)              tx -= vL;
                            else if (vL + curW < vw) tx += vw - (vL + curW);
                        }
                        if (curH >= vh) {
                            vT = elLayoutT + ty;
                            if (vT > 0)              ty -= vT;
                            vT = elLayoutT + ty;
                            if (vT + curH < vh)      ty += vh - (vT + curH);
                        } else if (curH >= vhv) {
                            vT = elLayoutT + ty;
                            if (vT > 0)               ty -= vT;
                            vT = elLayoutT + ty;
                            if (vT + curH < vhv)      ty += vhv - (vT + curH);
                        }
                    }
                    el.style.transform = 'translate(' + tx + 'px,' + ty + 'px) scale(' + scale + ')';
                    isImageZoomed = true;
                }
            }

            // During an active gesture we promote the layer (will-change:transform)
            // for smooth GPU compositing; at rest we drop the promotion so the
            // browser re-rasterises the image from its full source resolution and
            // the zoomed-in view is crisp rather than an up-scaled bitmap.
            let settleTimer = null;
            function beginGesture() {
                const el = media();
                if (el) {
                    el.style.willChange = 'transform';
                    // Set transform-origin once here, not on every apply() call.
                    el.style.transformOrigin = '0 0';
                }
                try { detailView.classList.add('zooming'); } catch(e) {}
                // Width lock only needed on mobile (iOS toolbar vw bug).
                // On desktop, screen.width != window width so skip it.
                if (!isDesktop()) lockMediaToViewport();
                if (settleTimer) { clearTimeout(settleTimer); settleTimer = null; }
            }
            function endGesture() {
                if (settleTimer) clearTimeout(settleTimer);
                settleTimer = setTimeout(function () {
                    const el = media();
                    if (el && scale > 1) el.style.willChange = 'auto'; // force re-raster
                    if (scale <= 1) {
                        try { detailView.classList.remove('zooming'); } catch(e) {}
                        unlockMediaSize();
                    }
                }, 120);
            }

            // Reset zoom whenever a new artwork is loaded.
            window.resetImageZoom = function () {
                scale = 1; tx = 0; ty = 0; mode = null; isImageZoomed = false;
                if (settleTimer) { clearTimeout(settleTimer); settleTimer = null; }
                const el = media();
                if (el) {
                    el.style.transform = '';
                    el.style.transformOrigin = '';
                    el.style.willChange = 'auto';
                }
                unlockMediaSize();
                try { detailView.classList.remove('zooming'); } catch(e) {}
            };

            // The visible viewport can change shape mid-zoom on iOS Safari
            // (the toolbar auto-hides as you scroll/pan) — re-lock so the
            // box keeps matching the actual screen, not a stale measurement.
            if (window.visualViewport) {
                window.visualViewport.addEventListener('resize', function () {
                    if (scale > 1 || mode) lockMediaToViewport();
                });
            }

            function dist(t) {
                return Math.hypot(t[0].clientX - t[1].clientX,
                                  t[0].clientY - t[1].clientY);
            }
            function mid(t) {
                return { x: (t[0].clientX + t[1].clientX) / 2,
                         y: (t[0].clientY + t[1].clientY) / 2 };
            }

            container.addEventListener('touchstart', function (e) {
                if (e.touches.length === 2) {
                    const el = media();
                    if (!el) return;
                    mode = 'pinch';
                    beginGesture();                  // calls lockMediaToViewport()
                    startDist = dist(e.touches) || 1;
                    startScale = scale;
                    const m = mid(e.touches);
                    startTx = tx; startTy = ty;
                    const r = el.getBoundingClientRect(); // one reflow here at gesture start
                    startRectL = r.left; startRectT = r.top;
                    // Cache layout position (= visual pos minus existing translation)
                    // and CSS dimensions so apply() never needs to read from the DOM.
                    elLayoutL = r.left - tx;
                    elLayoutT = r.top  - ty;
                    elW0 = el.offsetWidth;   // CSS width after lockMediaToViewport
                    elH0 = el.offsetHeight;  // CSS height:auto at that width
                    // remember the focal point in current screen coords
                    panStartX = m.x; panStartY = m.y;
                    e.preventDefault();
                } else if (e.touches.length === 1 && scale > 1) {
                    mode = 'pan';
                    beginGesture();
                    panStartX = panTapX = e.touches[0].clientX;
                    panStartY = panTapY = e.touches[0].clientY;
                    startTx = tx; startTy = ty;
                    e.preventDefault();
                } else {
                    mode = null;
                }
            }, { passive: false });

            container.addEventListener('touchmove', function (e) {
                if (mode === 'pinch' && e.touches.length === 2) {
                    e.preventDefault();
                    const d = dist(e.touches);
                    const m = mid(e.touches);
                    let newScale = startScale * (d / startDist);
                    newScale = Math.max(1, newScale);
                    // Keep the image point under the original focal point fixed and
                    // let it track the fingers (transform-origin 0 0). The element's
                    // start rect folds in its layout offset, so this stays correct
                    // even for vertically-centred images:
                    //   p0 = (focal - rectStart) / startScale   (intrinsic coord)
                    //   t  = focalNow - newScale*p0 - rectStart + startT
                    const p0x = (panStartX - startRectL) / startScale;
                    const p0y = (panStartY - startRectT) / startScale;
                    tx = m.x - newScale * p0x - startRectL + startTx;
                    ty = m.y - newScale * p0y - startRectT + startTy;
                    scale = newScale;
                    apply(true); // skip clamp during pinch — thresholds cause jumps
                } else if (mode === 'pan' && e.touches.length === 1 && scale > 1) {
                    e.preventDefault();
                    tx = startTx + (e.touches[0].clientX - panStartX);
                    ty = startTy + (e.touches[0].clientY - panStartY);
                    apply(); // clamp during pan so image can't be dragged off-screen
                }
            }, { passive: false });

            container.addEventListener('touchend', function (e) {
                if (e.touches.length >= 2) return;
                // Settle: snap back to 1× if we drifted just above it.
                if (scale <= 1.05) { scale = 1; tx = 0; ty = 0; }
                apply();
                if (e.touches.length === 1 && scale > 1) {
                    // second finger lifted but one remains → continue as a pan
                    mode = 'pan';
                    panStartX = e.touches[0].clientX;
                    panStartY = e.touches[0].clientY;
                    startTx = tx; startTy = ty;
                } else if (e.touches.length === 0) {
                    const wasPan = (mode === 'pan');
                    mode = null;
                    endGesture();
                    // Tap while zoomed: if the finger barely moved, treat it as a
                    // navigation tap (left half of screen = prev, right = next).
                    // Use screen centre, not image centre — when zoomed and panned
                    // the image centre can be off-screen, making image-relative
                    // left/right misalign with what the user sees as left/right.
                    if (wasPan && !isPinching) {
                        const t = e.changedTouches[0];
                        if (Math.abs(t.clientX - panTapX) + Math.abs(t.clientY - panTapY) < 10) {
                            // Suppress the synthetic click iOS generates from
                            // this touch — without this, handleDetailClick also
                            // fires on the same tap using image-relative logic
                            // and cancels the navigation we're about to trigger.
                            e.preventDefault();
                            const screenMid = detailView.clientWidth / 2;
                            navigateToAdjacentArtwork(null,
                                t.clientX < screenMid ? -1 : 1);
                        }
                    }
                }
            }, { passive: false });

            // ─────────────────────────────────────────────────────────────
            // DESKTOP ZOOM — trackpad pinch & Ctrl/⌘ + wheel
            // A trackpad pinch arrives as a `wheel` event with `ctrlKey:true`;
            // Ctrl/⌘ + mouse-wheel is the explicit fallback. We zoom the image
            // toward the cursor so the point under the pointer stays fixed,
            // while the text block (a fixed sibling) never moves. A plain wheel
            // with no modifier is left alone so tall images still scroll.
            // ─────────────────────────────────────────────────────────────
            // Wheel listener is on detailView (the scroll container) so that
            // Chrome/Safari see a non-passive listener at the container level and
            // don't intercept pinch events before our handler runs.
            detailView.addEventListener('wheel', function (e) {
                const el = media();
                if (!e.ctrlKey && !e.metaKey) {
                    // Plain wheel: pan the image while zoomed, otherwise let the
                    // page scroll (so tall images still scroll at 1×).
                    if (scale > 1 && el) {
                        e.preventDefault();
                        // Don't call beginGesture/endGesture on every event —
                        // that was toggling will-change and the settle timer
                        // on every scroll tick, causing jank.
                        tx -= e.deltaX;
                        ty -= e.deltaY;
                        apply();
                    }
                    return;
                }
                if (!el) return;
                if (!isPointOverMedia(el, e.clientX, e.clientY)) return;
                e.preventDefault();
                beginGesture();

                const r = el.getBoundingClientRect();
                const L0x = r.left - tx;
                const L0y = r.top  - ty;
                const px = (e.clientX - L0x - tx) / scale;
                const py = (e.clientY - L0y - ty) / scale;
                elLayoutL = L0x; elLayoutT = L0y;
                elW0 = el.offsetWidth; elH0 = el.offsetHeight;

                // Smooth, frame-rate-independent zoom factor from the wheel delta.
                let newScale = scale * Math.exp(-e.deltaY * 0.005);
                newScale = Math.max(1, newScale);

                tx = e.clientX - L0x - newScale * px;
                ty = e.clientY - L0y - newScale * py;
                scale = newScale;
                if (scale <= 1.001) { scale = 1; tx = 0; ty = 0; }
                apply();
                endGesture();
            }, { passive: false });

            // macOS Safari fires gesturestart/gesturechange/gestureend for trackpad
            // pinch instead of wheel+ctrlKey. We use these to zoom toward the cursor
            // and also call preventDefault to block native page zoom on both macOS
            // and iOS Safari.
            let cursorX = window.innerWidth / 2, cursorY = window.innerHeight / 2;
            let gestureStartScale = 1;
            let gestureL0x = 0, gestureL0y = 0, gesturePx = 0, gesturePy = 0;

            detailView.addEventListener('mousemove', function (e) {
                cursorX = e.clientX; cursorY = e.clientY;
            });

            container.addEventListener('gesturestart', function (e) {
                e.preventDefault();
                if (!isDesktop()) return;
                const el = media();
                if (!el) return;
                gestureStartScale = scale;
                beginGesture();
                const r = el.getBoundingClientRect();
                gestureL0x = r.left - tx;
                gestureL0y = r.top  - ty;
                gesturePx = (cursorX - gestureL0x - tx) / scale;
                gesturePy = (cursorY - gestureL0y - ty) / scale;
                elLayoutL = gestureL0x;
                elLayoutT = gestureL0y;
                elW0 = el.offsetWidth;
                elH0 = el.offsetHeight;
            }, { passive: false });

            container.addEventListener('gesturechange', function (e) {
                e.preventDefault();
                if (!isDesktop()) return;
                const el = media();
                if (!el) return;
                let newScale = Math.max(1, gestureStartScale * e.scale);
                tx = cursorX - gestureL0x - newScale * gesturePx;
                ty = cursorY - gestureL0y - newScale * gesturePy;
                scale = newScale;
                if (scale <= 1.001) { scale = 1; tx = 0; ty = 0; }
                apply();
            }, { passive: false });

            container.addEventListener('gestureend', function (e) {
                e.preventDefault();
                if (scale <= 1.05) { scale = 1; tx = 0; ty = 0; apply(); }
                endGesture();
            }, { passive: false });

            // Double-tap to reset zoom.
            let lastTap = 0;
            container.addEventListener('touchend', function (e) {
                if (e.touches.length !== 0) return;
                const t = e.timeStamp;
                if (t - lastTap < 300 && scale > 1) {
                    window.resetImageZoom();
                    e.preventDefault();
                }
                lastTap = t;
            }, { passive: false });
        })();
    </script>
</body>
</html>
