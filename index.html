<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Martyn Reynolds' Images</title>
   <style>
          body {
            margin: 0;
            padding: 0;
            background-color: #fff;
            overflow-x: hidden;
        }

        /* Container managing the structural swap between views */
        #archive-view {
            display: block;
            background-color: #fff;
        }

        .collage-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            grid-auto-rows: 150px;
            grid-auto-flow: dense;
            gap: 0; 
            background-color: #fff;
        }
        .collage-grid a,
        .collage-grid video {
            width: 100%;
            height: 100%;
            display: block;
            cursor: pointer;
            text-decoration: none;
        }
        .collage-grid img,
        .collage-grid video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .wide { grid-column: span 2; }
        .tall { grid-row: span 2; }
        .big  { grid-column: span 2; grid-row: span 2; }

        /* PRESENTATION MAIN PORTFOLIO LAYOUT WINDOW */
        #detail-view {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #fff;
            z-index: 100000;
            box-sizing: border-box;
            font-family: sans-serif;
            opacity: 0;
            transition: opacity 0.3s ease;
            overflow-y: scroll;
            -webkit-overflow-scrolling: touch;
            pointer-events: none;
            cursor: none;
        }

        #detail-view.active-stage {
            pointer-events: auto;
        }

        .gallery-split-wrapper {
            width: 100vw;
            min-height: 100vh;
            position: relative;
            display: block;
        }

        .artwork-container {
            width: 100vw;
            max-width: 100vw;
            min-height: 100vh;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: flex-start; /* mobile: image anchored to top */
        }

        /* Desktop: vertically centre the image within the viewport */
        @media (hover: hover) and (pointer: fine) {
            .artwork-container {
                align-items: center;
            }
        }

        .artwork-container img,
        .artwork-container video {
            width: 100vw;
            height: auto;
            object-fit: contain;
            display: block;
            position: relative;
            z-index: 1; /* sits above the wrapper click zone */
            /* pan-y keeps native vertical scrolling for tall images while
               disabling the browser's own pinch-zoom — our JS handles pinch
               so that ONLY the image scales and the text block stays locked. */
            touch-action: pan-y;
            /* NB: no static `will-change: transform`. A permanently-promoted
               layer is rasterised once at its on-screen (100vw) size and then
               GPU-upscaled when we scale() it — that is what made zoomed images
               look low-res. We toggle will-change ONLY during the live gesture
               (see JS) so the resting, zoomed image re-rasterises from the full
               source resolution and stays crisp. */
        }

        /* FLOATS TEXT CONVENIENTLY IN THE CORNER MINIMALIST STYLE */
        .artwork-details {
            text-align: right;
            box-sizing: border-box;
            padding: 0;
            margin-top: 0;
            position: fixed; 
            bottom: 18px;
            right: 18px;
            width: calc(100vw - 36px);
            z-index: 200000 !important;
            pointer-events: auto;
            transition: color 0.2s ease;
        }

        .artwork-details.light-text h1,
        .artwork-details.light-text p,
        .artwork-details.light-text .back-link {
            color: #fff !important;
        }

        .artwork-details h1 {
            font-weight: 300; 
            font-size: 11px;
            font-style: italic;
            letter-spacing: 1px;
            color: #000;
            margin: 0; 
            line-height: 1.38; 
        }

        .artwork-details p {
            color: #000;
            font-weight: 300; 
            font-size: 11px;
            letter-spacing: 1px; 
            margin: 0;
            line-height: 1.38; 
        }

        .artwork-details a {
            color: inherit;
            text-decoration: none;
            pointer-events: auto;
            cursor: pointer !important;
        }

        .artwork-details a:hover {
            color: #666;
        }

        .artwork-details.light-text a:hover {
            color: rgba(255, 255, 255, 0.5) !important;
        }

        .back-link {
            color: #000;
            font-size: 11px;
            font-weight: 300; 
            letter-spacing: 1px;
            text-transform: lowercase;
            display: inline-block;
            margin-top: 25px; 
            line-height: 1.38;
        }

        #detail-view.over-media a {
            cursor: pointer !important;
        }

        .back-link:hover { 
            color: #666; 
        }

        .artwork-details.light-text .back-link:hover { 
            color: rgba(255, 255, 255, 0.5) !important; 
        }

        /* Detail-view cursor: hidden over the image (the custom arrow stands in
           for it), default elsewhere so the white space reads as a clickable
           "return to grid" zone. */
        @media (hover: hover) and (pointer: fine) {
            #detail-view.over-media .artwork-container { cursor: none; }
            .artwork-details { cursor: none; }
            .artwork-details a { cursor: pointer !important; }
        }

        /* MINIMAL FLAT ARROW INDICATOR — desktop only, follows the cursor.
           Its colour is set in JS by sampling the image tone directly behind
           the cursor — the same brightness feature that drives the text block. */
        .nav-arrow {
            display: none; /* hidden on mobile / touch */
            position: fixed;
            top: 0;
            left: 0;
            transform: translate(-50%, -50%);
            z-index: 250000;
            pointer-events: none; /* never intercept clicks */
            opacity: 0;
            transition: opacity 0.15s ease;
            line-height: 1;
            font-size: 14px;
            letter-spacing: 0;
            font-weight: 100;
            font-family: "Arial Narrow", "Helvetica Neue", Helvetica, Arial, sans-serif;
            color: #000;
            text-rendering: optimizeLegibility;
            -webkit-font-smoothing: antialiased;
            text-transform: none;
            will-change: left, top, color;
        }

        @media (hover: hover) and (pointer: fine) {
            .nav-arrow { display: block; }
        }
    </style>
</head>

    <script>
        const archiveView    = document.getElementById('archive-view');
        const detailView     = document.getElementById('detail-view');
        const mediaTarget    = document.getElementById('media-target');
        const titleTarget    = document.getElementById('title-target');
        const infoTarget     = document.getElementById('info-target');
        const artworkDetails = document.querySelector('.artwork-details');

        let currentArtworkIndex = 0;
        let allArtworkElements = [];

        function refreshArtworkList() {
            allArtworkElements = Array.from(document.querySelectorAll('.collage-grid > a, .collage-grid > video'));
        }

        // ─────────────────────────────────────────────────────────────────
        // ORIENTATION HELPER
        // Uses matchMedia — reliable on Safari iOS unlike innerWidth/innerHeight
        // ─────────────────────────────────────────────────────────────────
        function isPortraitMode() {
            return window.matchMedia('(orientation: portrait)').matches;
        }

        function isDesktop() {
            return window.matchMedia('(hover: hover) and (pointer: fine)').matches;
        }

        // True when the cursor (cx, cy) sits within the rendered media bounds.
        function isPointOverMedia(mediaEl, cx, cy) {
            if (!mediaEl) return false;
            const r = mediaEl.getBoundingClientRect();
            return cx >= r.left && cx <= r.right && cy >= r.top && cy <= r.bottom;
        }

        // ─────────────────────────────────────────────────────────────────
        // INITIAL LAYOUT PER DEVICE + IMAGE ORIENTATION
        //   • Desktop: vertical images that overflow open scrolled to centre.
        //   • Mobile portrait images: top edge aligned to the top of the screen.
        //   • Mobile landscape images: centred vertically on the screen.
        // Called once the media has loaded (so its natural size is known).
        // ─────────────────────────────────────────────────────────────────
        function applyMediaLayout(mediaEl) {
            const w = mediaEl.naturalWidth  || mediaEl.videoWidth  || 0;
            const h = mediaEl.naturalHeight || mediaEl.videoHeight || 0;

            if (isDesktop()) {
                mediaTarget.style.alignItems = 'center';
                // Centre the scroll position on tall images that overflow.
                requestAnimationFrame(() => {
                    const maxScroll = detailView.scrollHeight - detailView.clientHeight;
                    detailView.scrollTop = maxScroll > 0 ? maxScroll / 2 : 0;
                });
            } else {
                // Portrait images: flex-start anchors the top edge to the screen top.
                // Landscape images: center them vertically in the viewport.
                // The CSS width:100vw / height:auto handles sizing — no inline override needed.
                mediaTarget.style.alignItems = h > w ? 'flex-start' : 'center';
                detailView.scrollTop = 0;
            }
        }

        // ─────────────────────────────────────────────────────────────────
        // CANVAS BRIGHTNESS SAMPLING
        // Shared core — pass any HTMLImageElement or HTMLVideoElement.
        // Returns average luminance (0–255) of the bottom-right patch,
        // or null if sampling failed (CORS, not ready, etc.)
        // ─────────────────────────────────────────────────────────────────
        function sampleBottomRightLuminance(mediaEl) {
            try {
                const sampleW = 220;
                const sampleH = 120;
                const canvas = document.createElement('canvas');
                canvas.width = sampleW;
                canvas.height = sampleH;
                const ctx = canvas.getContext('2d');

                const rect = mediaEl.getBoundingClientRect();

                let naturalW, naturalH;
                if (mediaEl.tagName.toLowerCase() === 'video') {
                    naturalW = mediaEl.videoWidth;
                    naturalH = mediaEl.videoHeight;
                    if (!naturalW || !naturalH) return null;
                } else {
                    naturalW = mediaEl.naturalWidth;
                    naturalH = mediaEl.naturalHeight;
                }

                // Scale factor between rendered pixels and source pixels
                const scaleX = naturalW / rect.width;
                const scaleY = naturalH / rect.height;

                // On-screen position of the text block (bottom-right, fixed)
                // We need to find what part of the image sits behind the text.
                // The text bottom edge is ~18px from screen bottom.
                // The text block is ~120px tall, so its top is ~138px from screen bottom.
                const screenH = window.innerHeight;
                const textAreaTopOnScreen = screenH - 138;  // approx top of text zone
                const textAreaBottomOnScreen = screenH - 18; // bottom of text zone

                // Convert screen y positions to image y positions
                // rect.top is where the image top edge sits on screen (may be negative if scrolled)
                const imgTopOnScreen = rect.top;
                const srcYtop    = Math.max(0, (textAreaTopOnScreen - imgTopOnScreen) * scaleY);
                const srcYbottom = Math.min(naturalH, (textAreaBottomOnScreen - imgTopOnScreen) * scaleY);

                // X: rightmost sampleW pixels
                const srcX = Math.max(0, naturalW - sampleW * scaleX);
                const srcW = naturalW - srcX;
                const srcH = srcYbottom - srcYtop;

                if (srcH <= 0 || srcW <= 0) return null; // text is off the image

                ctx.drawImage(mediaEl, srcX, srcYtop, srcW, srcH, 0, 0, sampleW, sampleH);
                const data = ctx.getImageData(0, 0, sampleW, sampleH).data;

                let total = 0;
                const pixels = sampleW * sampleH;
                for (let i = 0; i < data.length; i += 4) {
                    total += 0.2126 * data[i] + 0.7152 * data[i+1] + 0.0722 * data[i+2];
                }
                return total / pixels;
            } catch(e) {
                return null;
            }
        }

        // Generic: average luminance (0–255) of the image region under a
        // screen-space rectangle (sx, sy, sw, sh). Returns null if it can't
        // sample (cursor off the image, not loaded, CORS, etc.).
        function sampleLuminanceAtScreenRect(mediaEl, sx, sy, sw, sh) {
            try {
                const rect = mediaEl.getBoundingClientRect();
                let naturalW, naturalH;
                if (mediaEl.tagName.toLowerCase() === 'video') {
                    naturalW = mediaEl.videoWidth;
                    naturalH = mediaEl.videoHeight;
                } else {
                    naturalW = mediaEl.naturalWidth;
                    naturalH = mediaEl.naturalHeight;
                }
                if (!naturalW || !naturalH || rect.width <= 0 || rect.height <= 0) return null;

                const scaleX = naturalW / rect.width;
                const scaleY = naturalH / rect.height;

                // Intersect the screen rect with the media rect.
                const left   = Math.max(sx, rect.left);
                const right  = Math.min(sx + sw, rect.right);
                const top    = Math.max(sy, rect.top);
                const bottom = Math.min(sy + sh, rect.bottom);
                if (right <= left || bottom <= top) return null;

                const srcX = (left - rect.left) * scaleX;
                const srcY = (top  - rect.top)  * scaleY;
                const srcW = (right - left) * scaleX;
                const srcH = (bottom - top)  * scaleY;

                const outW = 24, outH = 16;
                const canvas = document.createElement('canvas');
                canvas.width = outW;
                canvas.height = outH;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(mediaEl, srcX, srcY, srcW, srcH, 0, 0, outW, outH);
                const data = ctx.getImageData(0, 0, outW, outH).data;

                let total = 0;
                const pixels = outW * outH;
                for (let i = 0; i < data.length; i += 4) {
                    total += 0.2126 * data[i] + 0.7152 * data[i+1] + 0.0722 * data[i+2];
                }
                return total / pixels;
            } catch(e) {
                return null;
            }
        }

        function applyTextColour(luminance) {
            artworkDetails.classList.toggle('light-text', luminance !== null && luminance < 168);
        }

        // ─────────────────────────────────────────────────────────────────
        // SCROLL-LINKED BRIGHTNESS LOOP
        // Runs on a throttled rAF loop while the detail view is open.
        // Samples on every animation frame but only recomputes every ~100ms.
        // ─────────────────────────────────────────────────────────────────
        let brightnessLoopActive = false;
        let lastBrightnessSample = 0;

        function startBrightnessLoop() {
            brightnessLoopActive = true;
            lastBrightnessSample = 0;

            function loop(timestamp) {
                if (!brightnessLoopActive) return;

                // Throttle: only sample every 100ms
                if (timestamp - lastBrightnessSample > 100) {
                    lastBrightnessSample = timestamp;

                    // Portrait, not zoomed: text sits below the image on white — always black.
                    // When zoomed (any orientation), sample the actual image region behind the text.
                    if (isPortraitMode() && !isImageZoomed) {
                        applyTextColour(255);
                    } else {
                        const mediaEl = mediaTarget.querySelector('img, video');
                        if (mediaEl) {
                            const lum = sampleBottomRightLuminance(mediaEl);
                            if (lum !== null) applyTextColour(lum);
                        }
                    }
                }
                requestAnimationFrame(loop);
            }
            requestAnimationFrame(loop);
        }

        function stopBrightnessLoop() {
            brightnessLoopActive = false;
        }

        // ─────────────────────────────────────────────────────────────────
        // PINCH-TO-ZOOM: mobile — suppress swipe/tap navigation during pinch
        // ─────────────────────────────────────────────────────────────────
        let isPinching = false;
        let isImageZoomed = false; // true while the image is pinched in past 1×

        detailView.addEventListener('touchstart', function(e) {
            if (e.touches.length >= 2) isPinching = true;
        }, { passive: true });

        detailView.addEventListener('touchend', function(e) {
            if (e.touches.length === 0) setTimeout(() => { isPinching = false; }, 300);
        }, { passive: true });

        detailView.addEventListener('touchmove', function(e) {
            if (e.touches.length >= 2) isPinching = true;
        }, { passive: true });

        // ─────────────────────────────────────────────────────────────────
        // CORE NAVIGATION
        // ─────────────────────────────────────────────────────────────────
        function showArtworkPage(element, mediaType) {
            refreshArtworkList();
            currentArtworkIndex = allArtworkElements.indexOf(element);
            if (currentArtworkIndex === -1) currentArtworkIndex = 0;

            const detectedType = mediaType || (element.tagName.toLowerCase() === 'video' ? 'video' : 'image');
            loadArtworkData(element, detectedType);

            archiveView.style.display = 'none';
            detailView.scrollTop = 0;

            detailView.style.display = 'block';
            detailView.classList.add('active-stage');

            setTimeout(() => {
                detailView.style.opacity = '1';
                startBrightnessLoop();
            }, 50);
        }

        function loadArtworkData(element, mediaType) {
            let rawText = "";
            artworkDetails.classList.remove('light-text');

            if (mediaType === 'video') {
                const source = element.querySelector('source');
                const newVideo = document.createElement('video');
                newVideo.setAttribute('autoplay', '');
                newVideo.setAttribute('loop', '');
                newVideo.setAttribute('muted', '');
                newVideo.setAttribute('playsinline', '');
                const newSource = document.createElement('source');
                newSource.src = source.src;
                newSource.type = 'video/mp4';
                newVideo.appendChild(newSource);
                mediaTarget.innerHTML = '';
                mediaTarget.appendChild(newVideo);
                newVideo.addEventListener('loadedmetadata', () => applyMediaLayout(newVideo));
                rawText = element.getAttribute('data-title') || "Video Documentation Loop";

            } else {
                const img = element.querySelector('img');
                if (img) {
                    const newImg = new Image();
                    newImg.alt = 'Focus view';
                    newImg.src = img.src;
                    mediaTarget.innerHTML = '';
                    mediaTarget.appendChild(newImg);
                    if (newImg.complete && newImg.naturalWidth) {
                        applyMediaLayout(newImg);
                    } else {
                        newImg.addEventListener('load', () => applyMediaLayout(newImg));
                    }
                    rawText = img.alt || "Untitled";
                }
            }

            const textSegments = rawText.split('|');
            titleTarget.textContent = textSegments[0] ? textSegments[0].trim() : "Untitled";

            if (textSegments.length > 1) {
                const descriptions = textSegments.slice(1).map(item => item.trim());
                const urlPattern = /^https?:\/\//i;

                if (descriptions.length > 1 && urlPattern.test(descriptions[descriptions.length - 1])) {
                    const url = descriptions.pop();
                    let lastDescription = descriptions.pop();
                    const linkedText = 'Sumer Gallery';

                    if (lastDescription.includes(linkedText)) {
                        lastDescription = lastDescription.replace(
                            linkedText,
                            `<a class="info-link" href="${url}" target="_blank" rel="noopener noreferrer">${linkedText}</a>`
                        );
                    } else {
                        lastDescription = `<a class="info-link" href="${url}" target="_blank" rel="noopener noreferrer">${lastDescription}</a>`;
                    }

                    descriptions.push(lastDescription);
                }

                infoTarget.innerHTML = descriptions.join('<br>');
            } else {
                infoTarget.textContent = "";
            }
        }

        function navigateToAdjacentArtwork(event, direction) {
            if (event) event.stopPropagation();
            if (isPinching) return;
            window.resetImageZoom();
            refreshArtworkList();

            currentArtworkIndex = (currentArtworkIndex + direction + allArtworkElements.length) % allArtworkElements.length;
            const targetElement = allArtworkElements[currentArtworkIndex];

            const detectedType = targetElement.tagName.toLowerCase() === 'video' ? 'video' : 'image';
            loadArtworkData(targetElement, detectedType);
            detailView.scrollTop = 0;
        }

        function hideArtworkPage(event) {
            if (event) {
                event.preventDefault();
                if (event.stopPropagation) event.stopPropagation();
            }
            stopBrightnessLoop();
            hideArrows();
            window.resetImageZoom();
            detailView.style.opacity = '0';
            detailView.classList.remove('active-stage');
            detailView.classList.remove('over-media');

            setTimeout(() => {
                detailView.style.display = 'none';
                mediaTarget.innerHTML = '';
                archiveView.style.display = 'block';

                if (allArtworkElements[currentArtworkIndex]) {
                    allArtworkElements[currentArtworkIndex].scrollIntoView({ block: 'center', behavior: 'auto' });
                }
            }, 300);
        }

        // ─────────────────────────────────────────────────────────────────
        // KEYBOARD
        // ─────────────────────────────────────────────────────────────────
        window.addEventListener('keydown', function(event) {
            if (detailView.style.display === 'block') {
                if (event.key === 'ArrowRight') navigateToAdjacentArtwork(event, 1);
                else if (event.key === 'ArrowLeft') navigateToAdjacentArtwork(event, -1);
                else if (event.key === 'Escape') hideArtworkPage(event);
            }
        });

        // ─────────────────────────────────────────────────────────────────
        // TOUCH SWIPE — blocked when pinching
        // ─────────────────────────────────────────────────────────────────
        let touchStartX = 0;
        let touchEndX = 0;

        detailView.addEventListener('touchstart', function(event) {
            if (event.touches.length === 1) {
                touchStartX = event.changedTouches[0].screenX;
            }
        }, { passive: true });

        detailView.addEventListener('touchend', function(event) {
            if (isPinching) return;
            if (event.touches.length === 0) {
                touchEndX = event.changedTouches[0].screenX;
                handleSwipeGesture(event);
            }
        }, { passive: true });

        function handleSwipeGesture(event) {
            if (isPinching || isImageZoomed) return; // a swipe while zoomed is a pan, not navigation
            const swipeDistance = touchEndX - touchStartX;
            const thresholdPixelGap = 50;

            if (Math.abs(swipeDistance) > thresholdPixelGap) {
                if (swipeDistance < 0) navigateToAdjacentArtwork(event, 1);
                else navigateToAdjacentArtwork(event, -1);
            }
            touchStartX = 0;
            touchEndX = 0;
        }

        // ─────────────────────────────────────────────────────────────────
        // ORIENTATION CHANGE — brightness loop handles it automatically,
        // but we force an immediate re-check on rotation
        // ─────────────────────────────────────────────────────────────────
        window.matchMedia('(orientation: portrait)').addEventListener('change', function() {
            setTimeout(() => {
                if (brightnessLoopActive) lastBrightnessSample = 0; // force immediate resample
            }, 150);
        });

        // ─────────────────────────────────────────────────────────────────
        // CLICK ROUTING (desktop + mobile)
        //   • Click on the image  → navigate (left half = previous, right = next)
        //   • Click on white space → return to the image grid
        // This reconciles points 3 & 4: the arrows live over the image, and the
        // surrounding white space is the "return to grid" button.
        // ─────────────────────────────────────────────────────────────────
        function handleDetailClick(event) {
            if (isPinching) return;
            const mediaEl = mediaTarget.querySelector('img, video');
            if (mediaEl && isPointOverMedia(mediaEl, event.clientX, event.clientY)) {
                const rect = mediaEl.getBoundingClientRect();
                const dir = event.clientX < (rect.left + rect.width / 2) ? -1 : 1;
                navigateToAdjacentArtwork(event, dir);
            } else {
                hideArtworkPage(event);
            }
        }

        // ─────────────────────────────────────────────────────────────────
        // CURSOR-TRACKING ARROW INDICATOR — desktop only
        // The arrow follows the cursor over the image, points in the direction
        // navigation will go, and flips black/white against the tone directly
        // behind it (the same luminance sampling that drives the text block).
        // ─────────────────────────────────────────────────────────────────
        const arrowLeft  = document.getElementById('arrow-left');
        const arrowRight = document.getElementById('arrow-right');
        let lastArrowSample = 0;
        let lastArrowColour = '#000';

        function hideArrows() {
            arrowLeft.style.opacity  = '0';
            arrowRight.style.opacity = '0';
        }

        function handleDetailMouseMove(event) {
            if (!isDesktop()) return;
            const mediaEl = mediaTarget.querySelector('img, video');

            // When hovering a metadata link, show the hand cursor, not the nav arrow.
            const elAtPoint = document.elementFromPoint(event.clientX, event.clientY);
            if (elAtPoint && elAtPoint.closest('.artwork-details a')) {
                detailView.classList.remove('over-media');
                hideArrows();
                return;
            }

            detailView.classList.add('over-media');
            const rect = mediaEl ? mediaEl.getBoundingClientRect() : { left: 0, width: window.innerWidth };
            const goLeft = event.clientX < (rect.left + rect.width / 2);
            const active = goLeft ? arrowLeft : arrowRight;
            const other  = goLeft ? arrowRight : arrowLeft;

            other.style.opacity = '0';
            active.style.left = event.clientX + 'px';
            active.style.top  = event.clientY + 'px';
            active.style.opacity = '1';

            // Throttle the (relatively costly) luminance sample to ~12/sec.
            if (event.timeStamp - lastArrowSample > 80) {
                lastArrowSample = event.timeStamp;
                const lum = sampleLuminanceAtScreenRect(
                    mediaEl, event.clientX - 20, event.clientY - 12, 40, 24);
                if (lum !== null) lastArrowColour = lum < 168 ? '#fff' : '#000';
            }
            active.style.color = lastArrowColour;
        }

        detailView.addEventListener('mousemove', handleDetailMouseMove);
        detailView.addEventListener('mouseleave', () => {
            detailView.classList.remove('over-media');
            hideArrows();
        });

        // ─────────────────────────────────────────────────────────────────
        // PINCH-TO-ZOOM — image only, so the text block stays locked
        //
        // Native page pinch-zoom is a compositor operation: the browser scales
        // the already-painted layer (text included) and won't repaint during
        // the gesture, so JS can never hold a fixed element still against it
        // (and iOS ignores user-scalable=no outright). Instead we suppress the
        // browser's own pinch and run our own: only the <img>/<video> gets a
        // CSS transform, so the text — a separate fixed sibling — never moves.
        // ─────────────────────────────────────────────────────────────────
        (function customPinchZoom() {
            const container = document.getElementById('media-target');
            if (!container) return;

            const MAX_SCALE = 5;
            let scale = 1, tx = 0, ty = 0;     // current transform of the media
            let startDist = 0, startScale = 1; // pinch baseline
            let startTx = 0, startTy = 0;
            let panStartX = 0, panStartY = 0;
            let panTapX = 0, panTapY = 0;      // finger position at pan start (tap detection)
            let startRectL = 0, startRectT = 0; // media rect at gesture start
            let mode = null;                   // 'pinch' | 'pan' | null

            function media() { return container.querySelector('img, video'); }

            function apply() {
                const el = media();
                if (!el) return;
                if (scale <= 1.001) {
                    scale = 1; tx = 0; ty = 0;
                    el.style.transform = '';
                    el.style.transformOrigin = '';
                    el.style.willChange = 'auto';
                    isImageZoomed = false;
                } else {
                    el.style.transformOrigin = '0 0';
                    el.style.transform = 'translate(' + tx + 'px,' + ty + 'px) scale(' + scale + ')';
                    // Clamp so the zoomed image always fills the viewport — no white bars.
                    const r = el.getBoundingClientRect();
                    const vw = window.innerWidth, vh = window.innerHeight;
                    let clamped = false;
                    if (r.width >= vw) {
                        if (r.left > 0)    { tx -= r.left;       clamped = true; }
                        if (r.right < vw)  { tx += vw - r.right; clamped = true; }
                    }
                    if (r.height >= vh) {
                        if (r.top > 0)     { ty -= r.top;         clamped = true; }
                        if (r.bottom < vh) { ty += vh - r.bottom; clamped = true; }
                    }
                    if (clamped) el.style.transform = 'translate(' + tx + 'px,' + ty + 'px) scale(' + scale + ')';
                    isImageZoomed = true;
                }
            }

            // During an active gesture we promote the layer (will-change:transform)
            // for smooth GPU compositing; at rest we drop the promotion so the
            // browser re-rasterises the image from its full source resolution and
            // the zoomed-in view is crisp rather than an up-scaled bitmap.
            let settleTimer = null;
            function beginGesture() {
                const el = media();
                if (el) el.style.willChange = 'transform';
                if (settleTimer) { clearTimeout(settleTimer); settleTimer = null; }
            }
            function endGesture() {
                if (settleTimer) clearTimeout(settleTimer);
                settleTimer = setTimeout(function () {
                    const el = media();
                    if (el && scale > 1) el.style.willChange = 'auto'; // force re-raster
                }, 120);
            }

            // Reset zoom whenever a new artwork is loaded.
            window.resetImageZoom = function () {
                scale = 1; tx = 0; ty = 0; mode = null; isImageZoomed = false;
                if (settleTimer) { clearTimeout(settleTimer); settleTimer = null; }
                const el = media();
                if (el) {
                    el.style.transform = '';
                    el.style.transformOrigin = '';
                    el.style.willChange = 'auto';
                }
            };

            function dist(t) {
                return Math.hypot(t[0].clientX - t[1].clientX,
                                  t[0].clientY - t[1].clientY);
            }
            function mid(t) {
                return { x: (t[0].clientX + t[1].clientX) / 2,
                         y: (t[0].clientY + t[1].clientY) / 2 };
            }

            container.addEventListener('touchstart', function (e) {
                if (e.touches.length === 2) {
                    const el = media();
                    if (!el) return;
                    mode = 'pinch';
                    beginGesture();
                    startDist = dist(e.touches) || 1;
                    startScale = scale;
                    const m = mid(e.touches);
                    startTx = tx; startTy = ty;
                    const r = el.getBoundingClientRect();
                    startRectL = r.left; startRectT = r.top;
                    // remember the focal point in current screen coords
                    panStartX = m.x; panStartY = m.y;
                    e.preventDefault();
                } else if (e.touches.length === 1 && scale > 1) {
                    mode = 'pan';
                    beginGesture();
                    panStartX = panTapX = e.touches[0].clientX;
                    panStartY = panTapY = e.touches[0].clientY;
                    startTx = tx; startTy = ty;
                    e.preventDefault();
                } else {
                    mode = null;
                }
            }, { passive: false });

            container.addEventListener('touchmove', function (e) {
                if (mode === 'pinch' && e.touches.length === 2) {
                    e.preventDefault();
                    const d = dist(e.touches);
                    const m = mid(e.touches);
                    let newScale = startScale * (d / startDist);
                    newScale = Math.max(1, Math.min(newScale, MAX_SCALE));
                    // Keep the image point under the original focal point fixed and
                    // let it track the fingers (transform-origin 0 0). The element's
                    // start rect folds in its layout offset, so this stays correct
                    // even for vertically-centred images:
                    //   p0 = (focal - rectStart) / startScale   (intrinsic coord)
                    //   t  = focalNow - newScale*p0 - rectStart + startT
                    const p0x = (panStartX - startRectL) / startScale;
                    const p0y = (panStartY - startRectT) / startScale;
                    tx = m.x - newScale * p0x - startRectL + startTx;
                    ty = m.y - newScale * p0y - startRectT + startTy;
                    scale = newScale;
                    apply();
                } else if (mode === 'pan' && e.touches.length === 1 && scale > 1) {
                    e.preventDefault();
                    tx = startTx + (e.touches[0].clientX - panStartX);
                    ty = startTy + (e.touches[0].clientY - panStartY);
                    apply();
                }
            }, { passive: false });

            container.addEventListener('touchend', function (e) {
                if (e.touches.length >= 2) return;
                // Settle: snap back to 1× if we drifted just above it.
                if (scale <= 1.05) { scale = 1; tx = 0; ty = 0; }
                apply();
                if (e.touches.length === 1 && scale > 1) {
                    // second finger lifted but one remains → continue as a pan
                    mode = 'pan';
                    panStartX = e.touches[0].clientX;
                    panStartY = e.touches[0].clientY;
                    startTx = tx; startTy = ty;
                } else if (e.touches.length === 0) {
                    const wasPan = (mode === 'pan');
                    mode = null;
                    endGesture();
                    // Tap while zoomed: if the finger barely moved, treat it as a
                    // navigation tap (left half = prev, right half = next).
                    if (wasPan && !isPinching) {
                        const t = e.changedTouches[0];
                        if (Math.abs(t.clientX - panTapX) + Math.abs(t.clientY - panTapY) < 10) {
                            const el = media();
                            if (el) {
                                const r = el.getBoundingClientRect();
                                navigateToAdjacentArtwork(null,
                                    t.clientX < (r.left + r.width / 2) ? -1 : 1);
                            }
                        }
                    }
                }
            }, { passive: false });

            // ─────────────────────────────────────────────────────────────
            // DESKTOP ZOOM — trackpad pinch & Ctrl/⌘ + wheel
            // A trackpad pinch arrives as a `wheel` event with `ctrlKey:true`;
            // Ctrl/⌘ + mouse-wheel is the explicit fallback. We zoom the image
            // toward the cursor so the point under the pointer stays fixed,
            // while the text block (a fixed sibling) never moves. A plain wheel
            // with no modifier is left alone so tall images still scroll.
            // ─────────────────────────────────────────────────────────────
            // Wheel listener is on detailView (the scroll container) so that
            // Chrome/Safari see a non-passive listener at the container level and
            // don't intercept pinch events before our handler runs.
            detailView.addEventListener('wheel', function (e) {
                const el = media();
                if (!e.ctrlKey && !e.metaKey) {
                    // Plain wheel: pan the image while zoomed, otherwise let the
                    // page scroll (so tall images still scroll at 1×).
                    if (scale > 1 && el) {
                        e.preventDefault();
                        beginGesture();
                        tx -= e.deltaX;
                        ty -= e.deltaY;
                        apply();
                        endGesture();
                    }
                    return;
                }
                if (!el) return;
                if (!isPointOverMedia(el, e.clientX, e.clientY)) return;
                e.preventDefault();
                beginGesture();

                const r = el.getBoundingClientRect();      // includes current transform
                const L0x = r.left - tx;                   // untransformed layout origin
                const L0y = r.top  - ty;
                const px = (e.clientX - L0x - tx) / scale;  // intrinsic point under cursor
                const py = (e.clientY - L0y - ty) / scale;

                // Smooth, frame-rate-independent zoom factor from the wheel delta.
                let newScale = scale * Math.exp(-e.deltaY * 0.005);
                newScale = Math.max(1, Math.min(newScale, MAX_SCALE));

                tx = e.clientX - L0x - newScale * px;
                ty = e.clientY - L0y - newScale * py;
                scale = newScale;
                if (scale <= 1.001) { scale = 1; tx = 0; ty = 0; }
                apply();
                endGesture();
            }, { passive: false });

            // macOS Safari fires gesturestart/gesturechange/gestureend for trackpad
            // pinch instead of wheel+ctrlKey. We use these to zoom toward the cursor
            // and also call preventDefault to block native page zoom on both macOS
            // and iOS Safari.
            let cursorX = window.innerWidth / 2, cursorY = window.innerHeight / 2;
            let gestureStartScale = 1;
            let gestureL0x = 0, gestureL0y = 0, gesturePx = 0, gesturePy = 0;

            detailView.addEventListener('mousemove', function (e) {
                cursorX = e.clientX; cursorY = e.clientY;
            });

            container.addEventListener('gesturestart', function (e) {
                e.preventDefault();
                if (!isDesktop()) return;
                const el = media();
                if (!el) return;
                gestureStartScale = scale;
                beginGesture();
                const r = el.getBoundingClientRect();
                gestureL0x = r.left - tx;
                gestureL0y = r.top  - ty;
                gesturePx = (cursorX - gestureL0x - tx) / scale;
                gesturePy = (cursorY - gestureL0y - ty) / scale;
            }, { passive: false });

            container.addEventListener('gesturechange', function (e) {
                e.preventDefault();
                if (!isDesktop()) return;
                const el = media();
                if (!el) return;
                let newScale = Math.max(1, Math.min(gestureStartScale * e.scale, MAX_SCALE));
                tx = cursorX - gestureL0x - newScale * gesturePx;
                ty = cursorY - gestureL0y - newScale * gesturePy;
                scale = newScale;
                if (scale <= 1.001) { scale = 1; tx = 0; ty = 0; }
                apply();
            }, { passive: false });

            container.addEventListener('gestureend', function (e) {
                e.preventDefault();
                if (scale <= 1.05) { scale = 1; tx = 0; ty = 0; apply(); }
                endGesture();
            }, { passive: false });

            // Double-tap to reset zoom.
            let lastTap = 0;
            container.addEventListener('touchend', function (e) {
                if (e.touches.length !== 0) return;
                const t = e.timeStamp;
                if (t - lastTap < 300 && scale > 1) {
                    window.resetImageZoom();
                    e.preventDefault();
                }
                lastTap = t;
            }, { passive: false });
        })();
    </script>
</body>
</html>
