<style>
body {
margin: 0;
padding: 0;
background-color: #000;
overflow-x: hidden;
}
#archive-view {
display: block;
}
.collage-grid {
display: grid;
grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
grid-auto-rows: 150px;
grid-auto-flow: dense;
gap: 0;
}
.collage-grid a,
.collage-grid video {
width: 100%;
height: 100%;
display: block;
cursor: pointer;
text-decoration: none;
}
.collage-grid img,
.collage-grid video {
width: 100%;
height: 100%;
object-fit: cover;
display: block;
}
.wide { grid-column: span 2; }
.tall { grid-row: span 2; }
.big { grid-column: span 2; grid-row: span 2; }
#detail-view {
display: none;
background-color: #000;
color: #fff;
font-family: sans-serif;
flex-direction: column;
align-items: center;
justify-content: center;
min-height: 100vh;
box-sizing: border-box;
padding: 40px 20px;
opacity: 0;
transition: opacity 0.3s ease;
}
.artwork-container {
max-width: 90vw;
max-height: 70vh;
margin-bottom: 35px;
}
.artwork-container img,
.artwork-container video {
max-width: 100%;
max-height: 70vh;
object-fit: contain;
display: block;
}
.artwork-details {
text-align: center;
max-width: 600px;
}
.artwork-details h1 {
font-weight: 300;
font-size: 16px;
letter-spacing: 2px;
text-transform: uppercase;
margin: 0 0 12px 0;
}
.artwork-details p {
color: #888;
font-weight: 300;
font-size: 13px;
letter-spacing: 1px;
line-height: 1.8;
margin: 0 0 35px 0;
}
.back-link {
color: #aaa;
text-decoration: none;
font-size: 11px;
letter-spacing: 2px;
text-transform: uppercase;
border-bottom: 1px solid #333;
padding-bottom: 4px;
cursor: pointer;
transition: color 0.2s ease, border-color 0.2s ease;
}
.back-link:hover {
color: #fff;
border-color: #fff;
}

<p id="info-target">Metadata detail parameters apply here cleanly.</p>

<script>
const archiveView = document.getElementById('archive-view');
const detailView = document.getElementById('detail-view');
const mediaTarget = document.getElementById('media-target');
const titleTarget = document.getElementById('title-target');
const infoTarget = document.getElementById('info-target');
function showArtworkPage(element, mediaType) {
let rawText = "";
if (mediaType === 'image') {
const img = element.querySelector('img');
mediaTarget.innerHTML = <img src="${img.src}" alt="Focus view">;
rawText = img.alt || "Untitled";
} else if (mediaType === 'video') {
const source = element.querySelector('source');
mediaTarget.innerHTML = <video autoplay loop muted playsinline controls><source src="${source.src}" type="video/mp4"></video>;
rawText = element.getAttribute('data-title') || "Video Documentation Loop";
}
const textSegments = rawText.split('|');
titleTarget.textContent = textSegments[0].trim();
if (textSegments.length > 1) {
const descriptions = textSegments.slice(1).map(item => item.trim());
infoTarget.innerHTML = descriptions.join('
');
} else {
infoTarget.textContent = "";
}
archiveView.style.display = 'none';
window.scrollTo(0, 0);
detailView.style.display = 'flex';
setTimeout(() => {
detailView.style.opacity = '1';
}, 50);
}
function hideArtworkPage() {
detailView.style.opacity = '0';
setTimeout(() => {
detailView.style.display = 'none';
mediaTarget.innerHTML = '';
archiveView.style.display = 'block';
}, 300);
}
