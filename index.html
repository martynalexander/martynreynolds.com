<!DOCTYPE html>

<head>
    <meta charset="UTF-8">

    <title>Martyn Reynolds Images</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            overflow-x: hidden;
        }

        /* Container managing the structural swap between views */
        #archive-view {
            display: block;
        }

        .collage-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            grid-auto-rows: 150px;
            grid-auto-flow: dense;
            gap: 0; 
        }
        .collage-grid a,
        .collage-grid video {
            width: 100%;
            height: 100%;
            display: block;
            cursor: pointer;
            text-decoration: none;
        }
        /* Forces BOTH images and videos to scale and zoom identically */
        .collage-grid img,
        .collage-grid video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .wide { grid-column: span 2; }
        .tall { grid-row: span 2; }
        .big  { grid-column: span 2; grid-row: span 2; }

        /* Minimal Secondary Artwork Details Page Layout Style */
        #detail-view {
            display: none; /* Hidden until items are clicked */
            background-color: #000;
            color: #fff;
            font-family: sans-serif;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            box-sizing: border-box;
            padding: 40px 20px;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .artwork-container {
            max-width: 90vw;
            max-height: 70vh;
            margin-bottom: 35px;
        }

        .artwork-container img, 
        .artwork-container video {
            max-width: 100%;
            max-height: 70vh;
            object-fit: contain;
            display: block;
        }

        .artwork-details {
            text-align: center;
            max-width: 600px;
        }

        /* Elegant Title Typography Block */
        .artwork-details h1 {
            font-weight: 300;
            font-size: 16px;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin: 0 0 12px 0;
        }

        /* Elegant Secondary Meta Metadata Column */
        .artwork-details p {
            color: #888;
            font-weight: 300;
            font-size: 13px;
            letter-spacing: 1px;
            line-height: 1.8;
            margin: 0 0 35px 0;
        }

        /* Minimal Navigation Back Button Link */
        .back-link {
            color: #aaa;
            text-decoration: none;
            font-size: 11px;
            letter-spacing: 2px;
            text-transform: uppercase;
            border-bottom: 1px solid #333;
            padding-bottom: 4px;
            cursor: pointer;
            transition: color 0.2s ease, border-color 0.2s ease;
        }

        .back-link:hover {
            color: #fff;
            border-color: #fff;
        }
    </style>
</head>
