<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Martyn Reynolds</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            overflow: hidden;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        video {
            max-width: 100vw;
            max-height: 100vh;
            width: auto;
            height: auto;
            display: block;
        }
    </style>
</head>
<body>
    <video controls playsinline>
        <source src="https://github.com/martynalexander/martynreynolds.com/releases/download/looksmaxxing_down_the_river_of_life/MartynReynolds_LooksmaxxingDownTheRiverOfLife_Shore_LecturePerformance_web.mp4" type="video/mp4">
    </video>
    <script>
        // iOS Safari only: webkitEnterFullscreen hides the address bar and
        // toolbar entirely (the standard Fullscreen API can't target a
        // <video> on iOS). Feature-detecting it naturally scopes this to
        // iOS Safari alone — no separate mobile check needed, and desktop/
        // other browsers are unaffected, staying inline as before.
        var video = document.querySelector('video');
        video.addEventListener('play', function () {
            if (video.webkitEnterFullscreen) {
                video.webkitEnterFullscreen();
            }
        }, { once: true });
    </script>
</body>
</html>
